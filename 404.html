<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>You’re invited</title>
<meta property="og:type" content="website">
<meta property="og:title" content="You’re invited">
<meta property="og:description" content="Tap to RSVP · Planned by KAI EVENTS">
</head>
<body style="margin:0;background:#F4F2EE;font:15px system-ui,sans-serif;color:#4A4A50">
<!-- Routes event addresses that have no folder of their own:
     /<event> and /<event>/rsvp → shared RSVP form. /<event>/guests → guest area. /<event>/portal and /<event>/portal/htnoam23 → shared guest screen.
     Old /guest and /manage links are sent to the new ones by _redirects (and still work here too). Anything else → not found. -->
<script>
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var p1 = parts[1];
  var page = parts.length >= 2 && (p1 === 'portal' || p1 === 'manage') ? '/app/manage.html' : parts.length === 2 && (p1 === 'guests' || p1 === 'guest') ? '/app/portal.html' : parts.length === 1 || (parts.length === 2 && p1 === 'rsvp') ? '/app/rsvp.html' : null;
  if (!page) { document.body.innerHTML = '<p style="text-align:center;padding:80px 20px">This page was not found.</p>'; return; }
  fetch(page, { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) { document.open(); document.write(html); document.close(); });
})();
</script>
</body>
</html>
