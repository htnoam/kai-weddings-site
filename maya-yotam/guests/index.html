<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Maya &amp; Yotam – Guest List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
/* Layout: one centered column (max 880px) on linen — header, four stat cards, replies-by-day chart, searchable guest list, add/edit dialog. Same look as the RSVP page. */
:root {
  --linen: #E9E3D8;
  --card: #FCFBF8;
  --ink: #2E3A9E;
  --ink-dark: #232D80;
  --ink-soft: #E7E9F6;
  --text: #1F1F21;
  --muted: #4A4A50;
  --soft: #6E6E75;
  --hair: #E2DED6;
  --line: #D6D4CE;
  --chip: #F1EFEA;
  --amber: #8A5A12;
  --amber-bg: #F7EBD3;
  --red: #9B2C2C;
  --red-bg: #F6E1E1;
  --sans: 'Assistant', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --serif: 'Cormorant Garamond', Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--linen); color: var(--text); font-family: var(--sans); font-variant-numeric: lining-nums; }
[hidden] { display: none !important; }
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 48px; display: flex; flex-direction: column; gap: 20px; }
header { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font: 600 13px var(--serif); letter-spacing: .3em; color: var(--ink); direction: ltr; }
h1 { margin: 0; font: 600 clamp(34px, 7vw, 46px)/1.05 var(--serif); color: var(--ink); direction: ltr; }
.sub { margin: 0; font-size: 15px; color: var(--soft); display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; padding: 0 4px; min-height: 32px; font: 500 15px var(--sans); color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.card { background: var(--card); border-radius: 4px; box-shadow: 0 1px 2px rgba(60,48,30,.10), 0 18px 30px -24px rgba(60,48,30,.45); }
.state { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 16px; line-height: 1.6; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { padding: 18px 16px; display: flex; flex-direction: column; gap: 4px; }
.stat .k { font-size: 14px; font-weight: 600; color: var(--muted); }
.stat .v { font: 600 40px/1 var(--serif); color: var(--text); font-variant-numeric: lining-nums tabular-nums; }
.stat .s { font-size: 13px; color: var(--soft); }
.stat.main { background: var(--ink); }
.stat.main .k, .stat.main .s { color: #D9DCF3; }
.stat.main .v { color: #FFFFFF; }

.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 640px) { .row2 { grid-template-columns: minmax(0, 1fr); } }
.panel { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { margin: 0; font-size: 17px; font-weight: 700; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: 52px minmax(0, 1fr) 28px; align-items: center; gap: 10px; font-size: 14px; }
.bar .d { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar .track { height: 14px; background: var(--chip); border-radius: 2px; overflow: hidden; }
.bar .fill { display: block; height: 100%; background: var(--ink); border-radius: 2px; }
.bar .n { font-weight: 600; font-variant-numeric: tabular-nums; text-align: left; }
.types { display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
.types div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--hair); padding-bottom: 8px; }
.types div:last-child { border: 0; padding: 0; }
.types b { font-variant-numeric: tabular-nums; }

.listhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn { height: 44px; padding: 0 18px; border-radius: 4px; border: 1px solid var(--ink); background: var(--ink); color: #FFFFFF; font: 600 15px var(--sans); cursor: pointer; }
.btn:hover { background: var(--ink-dark); }
.btn.ghost { background: #FFFFFF; color: var(--ink); }
.btn.ghost:hover { background: var(--ink-soft); }
.btn.danger { background: #FFFFFF; border-color: var(--red); color: var(--red); }
.btn.danger.sure { background: var(--red); color: #FFFFFF; }
.btn[disabled] { opacity: .6; cursor: default; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 220px; min-width: 0; height: 44px; border: 1px solid var(--line); border-radius: 4px; padding: 0 14px; font: 16px var(--sans); background: #FFFFFF; color: var(--text); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: #FFFFFF; font: 500 14px var(--sans); color: var(--text); cursor: pointer; }
.filters button[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.list { padding: 6px 0; }
.party { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 14px 20px; border-bottom: 1px solid var(--hair); align-items: center; }
.party:last-child { border-bottom: 0; }
.names { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.names .m { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.names .c { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.names .note { font-size: 13px; color: var(--soft); font-style: italic; overflow-wrap: anywhere; }
.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.yes { background: var(--ink-soft); color: var(--ink); }
.pill.maybe { background: var(--amber-bg); color: var(--amber); }
.pill.no { background: var(--red-bg); color: var(--red); }
.pill.heb { background: #FFFFFF; border: 1px dashed var(--amber); color: var(--amber); }
.count { font-size: 13px; color: var(--soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.edit { height: 36px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--line); background: #FFFFFF; font: 500 14px var(--sans); color: var(--ink); cursor: pointer; }
.edit:hover { background: var(--ink-soft); }
.empty { padding: 28px 20px; text-align: center; color: var(--soft); }
footer { text-align: center; font: 500 12px var(--serif); letter-spacing: .24em; color: var(--muted); direction: ltr; }

/* Dialog */
.overlay { position: fixed; inset: 0; background: rgba(31,31,33,.45); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; z-index: 20;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dialog { width: 100%; max-width: 560px; background: var(--card); border-radius: 4px; padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.4); }
.dialog h3 { margin: 0; font-size: 20px; font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lbl { font-size: 14px; font-weight: 600; color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.dialog input[type=text], .dialog input[type=tel], .dialog textarea, .dialog select { width: 100%; min-width: 0; height: 44px; border: 1px solid var(--line); border-radius: 4px; padding: 0 12px; font: 16px var(--sans); background: #FFFFFF; color: var(--text); }
.dialog textarea { height: auto; padding: 10px 12px; resize: vertical; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.seg button { min-height: 44px; border-radius: 4px; border: 1px solid var(--line); background: #FFFFFF; font: 500 15px var(--sans); color: var(--text); cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
.comps { display: flex; flex-direction: column; gap: 10px; }
.comp { border: 1px solid var(--hair); border-radius: 4px; padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.1fr) 44px; gap: 8px; align-items: end; }
@media (max-width: 520px) { .comp { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .comp .fieldtype { grid-column: 1 / 2; } }
.x { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--line); background: #FFFFFF; color: var(--red); font-size: 20px; cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.actions .group { display: flex; gap: 10px; flex-wrap: wrap; }
.formerr { margin: 0; font-size: 14px; color: var(--red); }

.toast { position: fixed; bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px)); left: 50%; transform: translateX(-50%); background: var(--text); color: #FFFFFF; padding: 10px 18px; border-radius: 4px; font-size: 15px; z-index: 30; }
@media (prefers-reduced-motion: no-preference) { .toast { transition: opacity .2s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">PORTO HELI · 3–5.6.2027</div>
    <h1>Maya &amp; Yotam</h1>
    <p class="sub"><span id="updated">טוען נתונים…</span><button type="button" class="linkbtn" id="refresh" hidden>רענון</button></p>
  </header>

  <div class="card state" id="state">טוען את רשימת האורחים…</div>

  <div id="app" hidden style="display:flex;flex-direction:column;gap:20px">
    <section class="stats" aria-label="סיכום">
      <div class="card stat main"><span class="k">מגיעים</span><span class="v" id="s-yes">0</span><span class="s" id="s-yes-sub"></span></div>
      <div class="card stat"><span class="k">עוד לא יודעים</span><span class="v" id="s-maybe">0</span><span class="s" id="s-maybe-sub"></span></div>
      <div class="card stat"><span class="k">לא מגיעים</span><span class="v" id="s-no">0</span><span class="s" id="s-no-sub"></span></div>
      <div class="card stat"><span class="k">סה״כ תשובות</span><span class="v" id="s-all">0</span><span class="s" id="s-all-sub"></span></div>
    </section>

    <section class="row2">
      <div class="card panel">
        <h2>תשובות לפי יום</h2>
        <div class="bars" id="bars"></div>
      </div>
      <div class="card panel">
        <h2>מי מגיע</h2>
        <div class="types" id="types"></div>
      </div>
    </section>

    <section class="card">
      <div class="panel" style="padding-bottom: 8px;">
        <div class="listhead">
          <h2>רשימת אורחים</h2>
          <button type="button" class="btn" id="add">+ הוספת אורח</button>
        </div>
        <div class="tools">
          <input class="search" id="q" type="search" placeholder="חיפוש לפי שם…" aria-label="חיפוש לפי שם">
          <div class="filters" id="filters" role="group" aria-label="סינון">
            <button type="button" data-f="all" aria-pressed="true">הכל</button>
            <button type="button" data-f="Yes" aria-pressed="false">מגיעים</button>
            <button type="button" data-f="Not sure" aria-pressed="false">לא יודעים</button>
            <button type="button" data-f="No" aria-pressed="false">לא מגיעים</button>
            <button type="button" data-f="heb" aria-pressed="false">שמות בעברית</button>
          </div>
        </div>
      </div>
      <div class="list" id="list"></div>
    </section>
  </div>

  <footer>PLANNED BY KAI EVENTS</footer>
</div>

<div class="overlay" id="overlay" hidden>
  <form class="dialog" id="form" role="dialog" aria-modal="true" aria-labelledby="dlg-title" novalidate>
    <h3 id="dlg-title">הוספת אורח</h3>
    <div class="two">
      <div class="field"><label class="lbl" for="f-first">שם פרטי</label><input id="f-first" type="text" autocomplete="off"></div>
      <div class="field"><label class="lbl" for="f-last">שם משפחה</label><input id="f-last" type="text" autocomplete="off"></div>
    </div>
    <div class="field"><label class="lbl" for="f-phone">טלפון</label><input id="f-phone" type="tel" dir="ltr" style="text-align:right" autocomplete="off"></div>
    <div class="field">
      <span class="lbl" id="f-att-lbl">סטטוס</span>
      <div class="seg" id="f-att" role="group" aria-labelledby="f-att-lbl">
        <button type="button" data-v="yes" aria-pressed="true">מגיעים</button>
        <button type="button" data-v="maybe" aria-pressed="false">לא יודעים</button>
        <button type="button" data-v="no" aria-pressed="false">לא מגיעים</button>
      </div>
    </div>
    <div class="field" id="f-comp-wrap">
      <span class="lbl">מגיעים איתו/ה</span>
      <div class="comps" id="f-comps"></div>
      <button type="button" class="btn ghost" id="f-add-comp" style="align-self:flex-start">+ הוספת מלווה</button>
    </div>
    <div class="field"><label class="lbl" for="f-note">הערה</label><textarea id="f-note" rows="2"></textarea></div>
    <p class="formerr" id="f-err" hidden></p>
    <div class="actions">
      <div class="group">
        <button type="submit" class="btn" id="f-save">שמירה</button>
        <button type="button" class="btn ghost" id="f-cancel">ביטול</button>
      </div>
      <button type="button" class="btn danger" id="f-del" hidden>מחיקה</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbxHcJDurgxLpAw9-nB3ONtvRk9VFxqopYjNJeFffN34UtSCdC5irDhWFY2lJ9m2EIW3Rg/exec';
  var KEY = (location.hash || '').replace(/^#/, '');
  var HEB = /[֐-׿]/;
  var TYPE_KEY = { 'Adult': 'adult', 'Child (up to 10)': 'child', 'Baby (up to 2)': 'baby' };
  var ATT_KEY = { 'Yes': 'yes', 'Not sure': 'maybe', 'No': 'no' };
  var LABEL = { 'Yes': ['yes', 'מגיעים'], 'Not sure': ['maybe', 'לא יודעים'], 'No': ['no', 'לא מגיעים'] };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var parties = [], filter = 'all', editing = null, att = 'yes';

  function toast(msg) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2600); }

  function load() {
    if (!KEY) { $('state').textContent = 'בקישור חסר קוד גישה. בקשו מנועם את הקישור המלא.'; $('updated').textContent = ''; return; }
    $('updated').textContent = 'טוען נתונים…';
    return fetch(API + '?k=' + encodeURIComponent(KEY)).then(function (r) { return r.json(); }).then(function (res) {
      if (!res.rows) { $('state').textContent = 'קוד הגישה בקישור לא תקין. בקשו מנועם את הקישור המלא.'; $('state').hidden = false; $('app').hidden = true; $('updated').textContent = ''; return; }
      var map = {}, order = [];
      res.rows.forEach(function (r) {
        if (!map[r.partyId]) { map[r.partyId] = { id: r.partyId, date: r.date, status: r.attending, phone: r.phone, note: r.note, people: [] }; order.push(r.partyId); }
        map[r.partyId].people.push([r.first, r.last, r.type]);
      });
      parties = order.map(function (id) { var p = map[id]; p.heb = p.people.some(function (x) { return HEB.test(x[0] + x[1]); }); return p; });
      $('state').hidden = true; $('app').hidden = false; $('refresh').hidden = false;
      var now = new Date();
      $('updated').textContent = 'אישורי הגעה · עודכן ב-' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      renderAll();
    }).catch(function () {
      $('state').textContent = 'לא הצלחנו לטעון את הנתונים. בדקו את החיבור ונסו שוב.'; $('state').hidden = false; $('app').hidden = true;
      $('updated').textContent = ''; $('refresh').hidden = false;
    });
  }

  function renderAll() {
    var by = function (st) { return parties.filter(function (p) { return p.status === st; }); };
    var ppl = function (arr) { return arr.reduce(function (s, p) { return s + p.people.length; }, 0); };
    var yes = by('Yes'), maybe = by('Not sure'), no = by('No');
    $('s-yes').textContent = ppl(yes); $('s-yes-sub').textContent = yes.length + ' תשובות';
    $('s-maybe').textContent = ppl(maybe); $('s-maybe-sub').textContent = maybe.length + ' תשובות';
    $('s-no').textContent = no.length; $('s-no-sub').textContent = no.length === 1 ? 'תשובה אחת' : no.length + ' תשובות';
    $('s-all').textContent = parties.length; $('s-all-sub').textContent = parties.length ? 'מאז ' + parties[0].date.slice(0, 5) : '';

    var days = {}, keys = [];
    parties.forEach(function (p) { if (!(p.date in days)) { days[p.date] = 0; keys.push(p.date); } days[p.date]++; });
    keys.sort(function (a, b) { return a.split('/').reverse().join('').localeCompare(b.split('/').reverse().join('')); });
    var max = Math.max.apply(null, keys.map(function (k) { return days[k]; }).concat([1]));
    $('bars').innerHTML = keys.length ? keys.slice(-10).map(function (d) {
      return '<div class="bar"><span class="d">' + esc(d.slice(0, 5)) + '</span><span class="track"><span class="fill" style="width:' + (days[d] / max * 100) + '%"></span></span><span class="n">' + days[d] + '</span></div>';
    }).join('') : '<div class="empty">עוד אין תשובות</div>';

    var t = { adult: 0, child: 0, baby: 0 };
    yes.forEach(function (p) { p.people.forEach(function (x) { t[TYPE_KEY[x[2]] || 'adult']++; }); });
    $('types').innerHTML = '<div><span>מבוגרים</span><b>' + t.adult + '</b></div><div><span>ילדים (עד גיל 10)</span><b>' + t.child + '</b></div><div><span>תינוקות (עד גיל 2)</span><b>' + t.baby + '</b></div>';
    renderList();
  }

  function renderList() {
    var q = $('q').value.trim().toLowerCase();
    var rows = parties.filter(function (p) {
      if (filter === 'heb' && !p.heb) return false;
      if (filter !== 'all' && filter !== 'heb' && p.status !== filter) return false;
      return !q || p.people.some(function (x) { return (x[0] + ' ' + x[1]).toLowerCase().indexOf(q) > -1; });
    });
    $('list').innerHTML = rows.length ? rows.slice().reverse().map(function (p) {
      var m = p.people[0], c = p.people.slice(1), l = LABEL[p.status] || LABEL.Yes;
      var n = p.status === 'No' ? '' : p.people.length + ' · ';
      return '<div class="party"><div class="names"><span class="m" dir="auto">' + esc(m[0] + ' ' + m[1]) + '</span>' +
        (c.length ? '<span class="c" dir="auto">+ ' + c.map(function (x) { return esc(x[0] + ' ' + x[1]) + (TYPE_KEY[x[2]] === 'child' ? ' (ילד/ה)' : TYPE_KEY[x[2]] === 'baby' ? ' (תינוק/ת)' : ''); }).join(', ') + '</span>' : '') +
        (p.note ? '<span class="note" dir="auto">' + esc(p.note) + '</span>' : '') +
        '</div><div class="meta">' + (p.heb ? '<span class="pill heb">שם בעברית</span>' : '') +
        '<span class="pill ' + l[0] + '">' + l[1] + '</span><span class="count">' + n + esc(p.date.slice(0, 5)) + '</span>' +
        '<button type="button" class="edit" data-id="' + esc(p.id) + '">עריכה</button></div></div>';
    }).join('') : '<div class="empty">לא נמצאו אורחים</div>';
  }

  // Dialog
  function compRow(c, i) {
    var div = document.createElement('div'); div.className = 'comp';
    div.innerHTML =
      '<div class="field"><label class="lbl" for="c-f-' + i + '">שם פרטי</label><input class="cf" id="c-f-' + i + '" type="text" autocomplete="off"></div>' +
      '<div class="field"><label class="lbl" for="c-l-' + i + '">שם משפחה</label><input class="cl" id="c-l-' + i + '" type="text" autocomplete="off"></div>' +
      '<div class="field fieldtype"><label class="lbl" for="c-t-' + i + '">גיל</label><select class="ct" id="c-t-' + i + '"><option value="adult">מבוגר</option><option value="child">ילד (עד 10)</option><option value="baby">תינוק (עד 2)</option></select></div>' +
      '<button type="button" class="x" aria-label="הסרת מלווה">×</button>';
    div.querySelector('.cf').value = c[0] || ''; div.querySelector('.cl').value = c[1] || ''; div.querySelector('.ct').value = TYPE_KEY[c[2]] || 'adult';
    div.querySelector('.x').addEventListener('click', function () { div.remove(); });
    $('f-comps').appendChild(div);
  }
  var compSeq = 0;
  function setAtt(v) { att = v; $('f-att').querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === v); }); $('f-comp-wrap').hidden = v === 'no'; }
  function openDialog(p) {
    editing = p || null;
    $('dlg-title').textContent = p ? 'עריכת אורח' : 'הוספת אורח';
    $('f-first').value = p ? p.people[0][0] : ''; $('f-last').value = p ? p.people[0][1] : '';
    $('f-phone').value = p ? p.phone : ''; $('f-note').value = p ? p.note : '';
    $('f-comps').innerHTML = '';
    if (p) p.people.slice(1).forEach(function (c) { compRow(c, ++compSeq); });
    setAtt(p ? (ATT_KEY[p.status] || 'yes') : 'yes');
    $('f-err').hidden = true; $('f-del').hidden = !p; $('f-del').classList.remove('sure'); $('f-del').textContent = 'מחיקה';
    $('overlay').hidden = false; $('f-first').focus();
  }
  function closeDialog() { $('overlay').hidden = true; editing = null; }
  function busy(on) { ['f-save', 'f-del', 'f-cancel'].forEach(function (id) { $(id).disabled = on; }); }
  function post(body) {
    body.k = KEY;
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); }).then(function (res) { if (!res.ok) throw new Error(res.error); return res; });
  }

  $('add').addEventListener('click', function () { openDialog(null); });
  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('.edit'); if (!b) return;
    openDialog(parties.filter(function (p) { return p.id === b.dataset.id; })[0]);
  });
  $('f-att').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setAtt(b.dataset.v); });
  $('f-add-comp').addEventListener('click', function () { compRow(['', '', 'Adult'], ++compSeq); var l = $('f-comps').lastChild.querySelector('.cf'); if (l) l.focus(); });
  $('f-cancel').addEventListener('click', closeDialog);
  $('overlay').addEventListener('click', function (e) { if (e.target === this) closeDialog(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('overlay').hidden) closeDialog(); });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!$('f-first').value.trim() || !$('f-last').value.trim()) { $('f-err').textContent = 'נא למלא שם פרטי ושם משפחה.'; $('f-err').hidden = false; return; }
    var comps = [].slice.call($('f-comps').children).map(function (d) {
      return { first: d.querySelector('.cf').value.trim(), last: d.querySelector('.cl').value.trim(), type: d.querySelector('.ct').value };
    }).filter(function (c) { return c.first || c.last; });
    var body = { action: 'save', partyId: editing ? editing.id : '', first: $('f-first').value.trim(), last: $('f-last').value.trim(),
      phone: $('f-phone').value.trim(), attend: att, note: $('f-note').value.trim(), companions: att === 'no' ? [] : comps };
    busy(true); $('f-save').textContent = 'שומרים…';
    post(body).then(function () { closeDialog(); toast(editing ? 'השינויים נשמרו' : 'האורח נוסף'); return load(); })
      .catch(function () { $('f-err').textContent = 'השמירה נכשלה. נסו שוב בעוד רגע.'; $('f-err').hidden = false; })
      .then(function () { busy(false); $('f-save').textContent = 'שמירה'; });
  });

  $('f-del').addEventListener('click', function () {
    var b = this;
    if (!b.classList.contains('sure')) { b.classList.add('sure'); b.textContent = 'בטוח? למחוק'; return; }
    busy(true); b.textContent = 'מוחקים…';
    post({ action: 'delete', partyId: editing.id }).then(function () { closeDialog(); toast('האורח נמחק'); return load(); })
      .catch(function () { $('f-err').textContent = 'המחיקה נכשלה. נסו שוב בעוד רגע.'; $('f-err').hidden = false; b.textContent = 'מחיקה'; b.classList.remove('sure'); })
      .then(function () { busy(false); });
  });

  $('q').addEventListener('input', renderList);
  $('filters').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.f;
    this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
    renderList();
  });
  $('refresh').addEventListener('click', load);
  window.addEventListener('hashchange', function () { KEY = location.hash.replace(/^#/, ''); load(); });
  load();
})();
</script>
</body>
</html>
