<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Guest List – Maya &amp; Yotam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Cormorant+Garamond:wght@600&display=swap">
<style>
/* Layout: white top bar, then one column (max 1360px): stats, toolbar, table + side panel. Below 760px the table becomes cards. */
:root {
  --bg: #F4F2EE;
  --surface: #FFFFFF;
  --soft-surface: #FAF9F6;
  --ink: #2E3A9E;
  --ink-dark: #232D80;
  --ink-soft: #F0F1FA;
  --text: #1F1F21;
  --muted: #4A4A50;
  --soft: #6E6E75;
  --line: #D6D4CE;
  --hair: #E4E1DA;
  --row-line: #EFECE6;
  --ok: #2F6B2F; --ok-bg: #E3EEDF;
  --warn: #8A5A12; --warn-bg: #F7EBD3;
  --tent: #2E3A9E; --tent-bg: #E7E9F6;
  --bad: #9B2C2C; --bad-bg: #F1E4E4;
  --sans: 'Assistant', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --serif: 'Cormorant Garamond', Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 var(--sans); font-variant-numeric: lining-nums; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.top { background: var(--surface); border-bottom: 1px solid var(--hair); }
.top-in { max-width: 1360px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
@media (min-width: 760px) { .top-in, .wrap { padding-left: 32px; padding-right: 32px; } }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.couple { font: 600 28px/1 var(--serif); color: var(--ink); }
.when { font-size: 14px; color: var(--soft); }
.me { display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--muted); }
.save { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.save.ok { color: var(--ok); } .save.busy { color: var(--soft); } .save.err { color: var(--bad); }

.wrap { max-width: 1360px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.gate { background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; padding: 40px 20px; text-align: center; color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.stat .k { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.stat .v { font-size: 32px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat.total { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
.stat.total .k { color: #D9DCF3; }
@media (max-width: 759px) { .stats { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; } .stat { padding: 8px 4px; align-items: center; gap: 2px; } .stat .v { font-size: 20px; order: -1; } .stat .k { font-size: 10px; letter-spacing: 0; text-transform: none; } }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--soft-surface); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #FFFFFF; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--ink-dark); }
.btn.on { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
.btn.dashed { border-style: dashed; background: transparent; color: var(--muted); }
.btn.danger { color: var(--bad); border-color: #E4C8C8; }
.search { flex: 1 1 220px; min-width: 0; height: 40px; border: 1px solid var(--line); border-radius: 6px; padding: 0 12px; background: var(--surface); }
.sel { height: 40px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; background: var(--surface); max-width: 100%; }
@media (max-width: 759px) { .toolbar .desk { display: none; } .toolbar .sel { flex: 1 1 30%; min-width: 0; } }

.subbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 40px; font-size: 14px; color: var(--muted); }
.subbar b { color: var(--text); }
.bulk { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; background: var(--text); color: #FFFFFF; border-radius: 6px; padding: 4px 6px 4px 14px; }
.bulk button { height: 32px; padding: 0 12px; border: none; border-radius: 4px; background: #3A3A3E; color: #FFFFFF; font-size: 14px; }
.bulk button.del { background: var(--bad); }
.bulk button.x { background: transparent; font-size: 18px; width: 32px; padding: 0; }

.layout { display: flex; gap: 16px; align-items: flex-start; }
.tablewrap { flex: 1 1 auto; min-width: 0; background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 900px; }
th { text-align: left; font-size: 13px; font-weight: 600; color: var(--muted); background: var(--soft-surface); border-bottom: 1px solid var(--hair); padding: 0; white-space: nowrap; }
th button { width: 100%; text-align: left; border: none; background: none; padding: 10px; font-weight: 600; color: inherit; }
th button:hover { color: var(--text); }
th.chk, td.chk { width: 44px; padding-left: 14px; }
td { border-bottom: 1px solid var(--row-line); padding: 0; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
td .c { padding: 11px 10px; min-height: 44px; display: flex; align-items: center; gap: 8px; }
td.ed { cursor: text; }
td.ed:hover { background: #F7F6F2; }
td.num .c { color: var(--soft); font-variant-numeric: tabular-nums; }
td[data-k="phone"] .c { white-space: nowrap; }
tr.sel-row td { background: #F7F7FC; }
tr.open-row td { background: var(--ink-soft); }
tr.grp td { background: var(--bg); font-size: 13px; font-weight: 700; color: var(--muted); padding: 8px 14px; }
td input.cell, td select.cell { width: 100%; height: 36px; border: 2px solid var(--ink); border-radius: 4px; padding: 0 8px; background: #FFFFFF; min-width: 80px; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--ink); margin: 0; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill.Confirmed { background: var(--ok-bg); color: var(--ok); }
.pill.Pending { background: var(--warn-bg); color: var(--warn); }
.pill.Tentative { background: var(--tent-bg); color: var(--tent); }
.pill.Declined { background: var(--bad-bg); color: var(--bad); }
.wa { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 6px; color: var(--ok); flex: none; }
.wa:hover { background: var(--ok-bg); }
.more { width: 36px; height: 36px; border: none; border-radius: 6px; background: transparent; color: var(--soft); font-size: 18px; }
.more:hover { background: var(--bg); color: var(--text); }
.empty { padding: 32px; text-align: center; color: var(--soft); }
.ph { color: #A3A19A; }

.cards { display: none; flex-direction: column; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.card.sel-row { border-color: var(--ink); background: #F7F7FC; }
.card .r1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .nm { font-size: 16px; font-weight: 700; border: none; background: none; padding: 0; text-align: left; }
.card .r2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--soft); }
.card .nt { font-size: 13px; color: var(--muted); font-style: italic; }
.card .grph { font-size: 13px; font-weight: 700; color: var(--muted); padding: 6px 2px 0; }
@media (max-width: 759px) { .tablewrap { display: none; } .cards { display: flex; } .layout { display: block; } }

.panel { flex: 0 0 360px; background: var(--surface); border: 1px solid var(--hair); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; }
.panel .hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.panel .meta { font-size: 13px; color: var(--soft); }
.panel .name { font-size: 22px; font-weight: 700; line-height: 1.2; }
.panel .x { width: 40px; height: 40px; border: 1px solid var(--hair); border-radius: 6px; background: #FFFFFF; font-size: 18px; color: var(--muted); flex: none; }
.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.f input, .f select, .f textarea { height: 40px; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; font-size: 15px; font-weight: 400; color: var(--text); background: #FFFFFF; min-width: 0; width: 100%; }
.f textarea { height: auto; padding: 8px 10px; resize: vertical; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.same { background: var(--bg); border-radius: 6px; padding: 10px 12px; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.same button { border: 1px solid var(--line); background: #FFFFFF; border-radius: 999px; padding: 2px 10px; font-size: 13px; }
.hist { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--row-line); padding-top: 14px; }
.hist h3 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.hist .it { font-size: 14px; display: flex; flex-direction: column; gap: 1px; }
.hist .it span { color: var(--soft); font-size: 13px; }
.prow { display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 759px) {
  .panel { position: fixed; inset: 0; z-index: 30; max-height: none; border-radius: 0; border: none; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
}

.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px)); height: 52px; padding: 0 20px; border: none; border-radius: 999px; background: var(--ink); color: #FFFFFF; font-size: 16px; font-weight: 600; display: none; align-items: center; gap: 8px; box-shadow: 0 10px 24px -8px rgba(46,58,158,.6); z-index: 10; }
@media (max-width: 759px) { .fab.show { display: inline-flex; } }

.menu { position: fixed; z-index: 50; min-width: 240px; background: #FFFFFF; border: 1px solid var(--hair); border-radius: 8px; box-shadow: 0 16px 40px -12px rgba(0,0,0,.35); padding: 6px; display: flex; flex-direction: column; }
.menu .mh { font-size: 12px; color: var(--soft); padding: 6px 10px 4px; }
.menu button.mi { text-align: left; border: none; background: none; padding: 9px 10px; border-radius: 6px; min-height: 38px; }
.menu button.mi:hover, .menu button.mi:focus-visible { background: var(--bg); }
.menu button.mi.del { color: var(--bad); }
.menu .seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 8px 8px; }
.menu .seg button { border: 1px solid var(--line); background: #FFFFFF; border-radius: 999px; padding: 3px 10px; font-size: 13px; min-height: 30px; }
.menu .seg button.cur { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
.menu hr { border: none; border-top: 1px solid var(--row-line); margin: 4px 0; }
@media (max-width: 759px) { .menu.sheet { left: 0 !important; right: 0; top: auto !important; bottom: 0; border-radius: 14px 14px 0 0; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); max-height: 80vh; overflow-y: auto; } }
.scrim { position: fixed; inset: 0; z-index: 45; background: rgba(31,31,33,.25); }

.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(31,31,33,.45); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(48px, env(safe-area-inset-top, 0px)) 16px 24px; }
.dialog { width: 100%; max-width: 520px; background: #FFFFFF; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.4); }
.dialog h2 { margin: 0; font-size: 20px; }
.dialog .act { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; padding-top: 4px; }
.err { margin: 0; color: var(--bad); font-size: 14px; }
.colrow { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.colrow label { flex: 1; display: flex; align-items: center; gap: 10px; font-size: 15px; }
.colrow button { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 6px; background: #FFFFFF; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(24px, calc(env(safe-area-inset-bottom, 0px) + 16px)); z-index: 70; background: var(--text); color: #FFFFFF; border-radius: 8px; padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 12px; font-size: 15px; max-width: calc(100% - 32px); }
.toast.bad { background: var(--bad); }
.toast button { border: none; background: transparent; color: #C9CEF5; font-weight: 700; padding: 4px 6px; }
@media (prefers-reduced-motion: no-preference) { .menu, .toast { animation: pop .12s ease-out; } @keyframes pop { from { opacity: 0; transform: translateY(4px); } } .toast { animation: none; } }

/* ===== Dense workspace layout (preview) ===== */
.top-in, .wrap { max-width: none; }
.top-in { padding: 6px 12px !important; gap: 10px 16px; }
.couple { font-size: 21px; }
.when { font-size: 13px; }
.me { font-size: 13px; gap: 10px; }
.me .btn { height: 28px; padding: 0 10px; font-size: 13px; }
.top .stats { display: flex; gap: 4px; flex: 1 1 auto; justify-content: center; }
.top .stat { flex-direction: row; align-items: baseline; gap: 6px; padding: 3px 10px; border-radius: 4px; background: var(--soft-surface); }
.top .stat .v { font-size: 16px; order: 0; }
.top .stat .k { font-size: 11px; letter-spacing: .03em; }
.top .stat.total { background: var(--ink); }
.wrap { padding: 8px 12px 12px !important; gap: 6px; }
#app { gap: 6px !important; }
.toolbar { gap: 6px; }
.btn { height: 30px; padding: 0 10px; font-size: 13.5px; border-radius: 4px; }
.search { flex: 0 1 260px; height: 30px; border-radius: 4px; padding: 0 10px; font-size: 13.5px; }
.sel { height: 30px; border-radius: 4px; font-size: 13.5px; padding: 0 4px; }
.subbar { min-height: 28px; font-size: 13px; }
.bulk { padding: 2px 4px 2px 10px; font-size: 13px; }
.bulk button { height: 24px; font-size: 13px; padding: 0 10px; }

@media (min-width: 760px) {
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  #app:not([hidden]) { flex: 1 1 auto; min-height: 0; }
  .layout { flex: 1 1 auto; min-height: 0; }
  .tablewrap { max-height: 100%; overflow: auto; }
}
.tablewrap { border-radius: 4px; border-color: var(--line); }
table { border-collapse: separate; border-spacing: 0; table-layout: fixed; min-width: 1000px; font-size: 13.5px; }
th { position: sticky; top: 0; z-index: 2; background: #F1EFEA; color: var(--muted); font-size: 12.5px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--hair); }
th button { padding: 6px 8px; overflow: hidden; text-overflow: ellipsis; }
th.chk, td.chk { width: 34px; padding: 0; text-align: center; }
th[data-k="no"] { width: 76px; } th[data-k="first"] { width: 120px; } th[data-k="last"] { width: 140px; }
th[data-k="group"] { width: 180px; } th[data-k="age"] { width: 80px; } th[data-k="status"] { width: 112px; }
th[data-k="phone"] { width: 168px; } th.mo { width: 34px !important; border-right: none; }
td { border-bottom: 1px solid var(--hair); border-right: 1px solid var(--hair); }
td:last-child { border-right: none; }
tr:last-child td { border-bottom: 1px solid var(--hair); }
td .c { display: block; padding: 0 8px; min-height: 0; height: 29px; line-height: 29px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
td.num .c { text-align: right; padding-right: 10px; }
td[data-k="first"] b { font-weight: 600; }
tbody tr[data-no]:hover td { background: #F8F7F3; }
td.ed:hover { background: #EFEEE8 !important; }
tr.sel-row td { background: #EEF0FA; }
tr.open-row td { background: var(--ink-soft); }
tr.grp td { padding: 4px 8px; font-size: 12.5px; background: #F6F5F1; border-right: none; }
td input.cell, td select.cell { height: 29px; border-radius: 0; padding: 0 6px; min-width: 0; display: block; }
td:has(.cell) .c { padding: 0; }
input[type=checkbox] { width: 15px; height: 15px; vertical-align: middle; }
.pill { background: none !important; padding: 0; font-weight: 600; font-size: inherit; }
.pill::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
td .wa { width: 22px; height: 22px; vertical-align: middle; margin-left: 4px; visibility: hidden; }
tbody tr:hover td .wa, td .wa:focus-visible { visibility: visible; }
.more { width: 26px; height: 26px; font-size: 15px; vertical-align: middle; }
td .btn[data-restore] { height: 24px !important; margin: 0 !important; padding: 0 6px; font-size: 12px; }
.empty { padding: 20px; }

@media (min-width: 760px) {
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: 380px; max-height: none; border-radius: 0; border: none; border-left: 1px solid var(--line); z-index: 40; padding: 14px 16px; gap: 10px; box-shadow: -12px 0 32px -16px rgba(0,0,0,.3); }
}
.panel .name { font-size: 19px; }
.panel .x { width: 30px; height: 30px; }
.f { font-size: 12px; gap: 2px; }
.f input, .f select { height: 32px; font-size: 14px; border-radius: 4px; }
.f textarea { font-size: 14px; border-radius: 4px; }
.hist { padding-top: 10px; gap: 6px; }
.hist .it { font-size: 13px; }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="couple" id="couple">Guest List</span><span class="when" id="when"></span></div>
    <section class="stats" id="stats" aria-label="Summary"></section>
    <div class="me">
      <span class="save ok" id="save" aria-live="polite" hidden></span>
      <span id="who"></span>
      <button type="button" class="btn" id="refresh" hidden>Refresh</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="gate" id="gate">Loading your guest list…</div>

  <div id="app" hidden style="display:flex;flex-direction:column;gap:18px">

    <section class="toolbar" aria-label="Actions">
      <button type="button" class="btn primary desk" id="add"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add Guest</button>
      <button type="button" class="btn desk" id="import" disabled title="Coming in the next step">Import Guests</button>
      <label class="sr" for="q">Search by name or phone</label>
      <input class="search" id="q" type="search" placeholder="Search by name or phone" autocomplete="off">
      <label class="sr" for="f-status">Filter by RSVP status</label>
      <select class="sel" id="f-status"><option value="">RSVP: All</option><option>Confirmed</option><option>Pending</option><option>Tentative</option><option>Declined</option></select>
      <label class="sr" for="f-age">Filter by age group</label>
      <select class="sel" id="f-age"><option value="">Age: All</option><option>Adult</option><option>Child</option><option>Baby</option></select>
      <label class="sr" for="f-group">Filter by guest group</label>
      <select class="sel" id="f-group"><option value="">Group: All</option></select>
      <button type="button" class="btn desk" id="groupby" aria-pressed="false">Group by family</button>
      <button type="button" class="btn desk" id="columns">Columns</button>
      <button type="button" class="btn" id="export">Export</button>
      <button type="button" class="btn" id="trash" aria-pressed="false">Deleted (0)</button>
      <button type="button" class="btn dashed desk" id="addcol" hidden disabled title="Coming in the next step">+ Add Column</button>
    </section>

    <div class="subbar">
      <span id="showing"></span>
      <div class="bulk" id="bulk" hidden>
        <span id="bulk-n"></span>
        <button type="button" data-bulk="status">Change status</button>
        <button type="button" data-bulk="age">Age group</button>
        <button type="button" data-bulk="group">Assign group</button>
        <button type="button" class="del" data-bulk="delete">Delete</button>
        <button type="button" class="x" data-bulk="clear" aria-label="Clear selection">×</button>
      </div>
    </div>

    <div class="layout">
      <div class="tablewrap">
        <table>
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="empty" hidden>No guests match these filters.</div>
      </div>
      <div class="cards" id="cards"></div>
      <aside class="panel" id="panel" hidden aria-label="Guest details"></aside>
    </div>
  </div>
</main>

<button type="button" class="fab" id="fab"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add Guest</button>
<div class="scrim" id="scrim" hidden></div>
<div class="menu" id="menu" role="menu" hidden></div>

<div class="overlay" id="dlg" hidden>
  <form class="dialog" id="addform" role="dialog" aria-modal="true" aria-labelledby="dlg-title" novalidate>
    <h2 id="dlg-title">Add Guest</h2>
    <div class="two">
      <label class="f">First Name *<input id="a-first" autocomplete="off"></label>
      <label class="f">Last Name *<input id="a-last" autocomplete="off"></label>
    </div>
    <label class="f">Phone *<input id="a-phone" type="tel" placeholder="+972 52 000 0000" autocomplete="off"></label>
    <div class="two">
      <label class="f">Age Group *<select id="a-age"><option value="Adult">Adult</option><option value="Child">Child (3–10)</option><option value="Baby">Baby (0–2)</option></select></label>
      <label class="f">RSVP Status *<select id="a-status"><option>Pending</option><option>Confirmed</option><option>Tentative</option><option>Declined</option></select></label>
    </div>
    <label class="f">Guest Group<input id="a-group" list="groups" placeholder="Choose existing or type a new one" autocomplete="off"></label>
    <label class="f">Notes<textarea id="a-notes" rows="2"></textarea></label>
    <p class="err" id="a-err" hidden></p>
    <div class="act">
      <button type="button" class="btn" id="a-cancel">Cancel</button>
      <button type="button" class="btn" id="a-another" style="color:var(--ink);border-color:var(--ink)">Save &amp; add another</button>
      <button type="submit" class="btn primary" id="a-save">Save</button>
    </div>
  </form>
</div>

<div class="overlay" id="dlg2" hidden>
  <form class="dialog" id="pickform" role="dialog" aria-modal="true" aria-labelledby="pick-title" novalidate>
    <h2 id="pick-title"></h2>
    <div id="pick-body"></div>
    <p class="err" id="pick-err" hidden></p>
    <div class="act">
      <button type="button" class="btn" id="pick-cancel">Cancel</button>
      <button type="submit" class="btn primary" id="pick-ok">Apply</button>
    </div>
  </form>
</div>

<datalist id="groups"></datalist>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';
  var API = 'https://script.google.com/macros/s/AKfycbxHcJDurgxLpAw9-nB3ONtvRk9VFxqopYjNJeFffN34UtSCdC5irDhWFY2lJ9m2EIW3Rg/exec';
  var KEY = location.hash.replace(/^#/, '') || 'C-rLUyqb2K-fqj6e_rgLDN';
  var AGES = ['Adult', 'Child', 'Baby'];
  var STATUSES = ['Confirmed', 'Pending', 'Tentative', 'Declined'];
  var COLS = [
    { k: 'no', label: 'Guest No.', fixed: true },
    { k: 'first', label: 'First Name', type: 'text', req: true },
    { k: 'last', label: 'Last Name', type: 'text', req: true },
    { k: 'group', label: 'Guest Group', type: 'group' },
    { k: 'age', label: 'Age Group', type: 'select', opts: AGES },
    { k: 'status', label: 'RSVP Status', type: 'select', opts: STATUSES },
    { k: 'phone', label: 'Phone', type: 'phone', req: true },
    { k: 'notes', label: 'Notes', type: 'text' }
  ];
  var HEB = /[֐-׿]/;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  var S = { guests: [], who: '', admin: false, q: '', status: '', age: '', group: '', groupBy: false, trash: false,
    sort: { k: 'no', dir: 1 }, checked: {}, open: null, editing: null, cols: null, pending: 0 };

  // ---------- column prefs (per browser) ----------
  function loadCols() {
    var def = { order: COLS.map(function (c) { return c.k; }), hidden: [] };
    try { var p = JSON.parse(localStorage.getItem('kai-guest-cols') || 'null'); if (p && p.order) { COLS.forEach(function (c) { if (p.order.indexOf(c.k) < 0) p.order.push(c.k); }); p.order = p.order.filter(function (k) { return COLS.some(function (c) { return c.k === k; }); }); S.cols = p; return; } } catch (e) {}
    S.cols = def;
  }
  function saveCols() { try { localStorage.setItem('kai-guest-cols', JSON.stringify(S.cols)); } catch (e) {} }
  function visibleCols() { return S.cols.order.map(function (k) { return COLS.filter(function (c) { return c.k === k; })[0]; }).filter(function (c) { return c.fixed || S.cols.hidden.indexOf(c.k) < 0; }); }

  // ---------- helpers ----------
  function normPhone(p) {
    var s = String(p || '').replace(/[^\d+]/g, '');
    if (!s) return '';
    if (s.indexOf('00') === 0) s = '+' + s.slice(2);
    else if (s.charAt(0) === '0') s = '+972' + s.slice(1);
    else if (s.charAt(0) !== '+') s = '+' + s;
    return s;
  }
  function prettyPhone(p) {
    var m = /^\+972(\d{2})(\d{3})(\d{4})$/.exec(p || '');
    if (m) return '+972 ' + m[1] + ' ' + m[2] + ' ' + m[3];
    var u = /^\+44(\d{4})(\d{6})$/.exec(p || '');
    if (u) return '+44 ' + u[1] + ' ' + u[2];
    return p || '';
  }
  function waLink(p) { var d = String(p || '').replace(/\D/g, ''); return d ? 'https://wa.me/' + d : ''; }
  function byNo(no) { return S.guests.filter(function (g) { return g.no === no; })[0]; }
  function live() { return S.guests.filter(function (g) { return !g.deleted; }); }
  function fmtDate(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); if (!m) return d || '';
    var mon = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][Number(m[2]) - 1];
    return Number(m[3]) + ' ' + mon + ' ' + m[1];
  }
  function validate(f) {
    var errs = [];
    if ('first' in f && !String(f.first).trim()) errs.push('First Name is required.');
    if ('last' in f && !String(f.last).trim()) errs.push('Last Name is required.');
    if ('phone' in f && !String(f.phone).trim()) errs.push('Phone is required.');
    if (('first' in f && HEB.test(f.first)) || ('last' in f && HEB.test(f.last))) errs.push('Please write names in English.');
    if ('phone' in f && String(f.phone).trim() && !/^\+\d{8,15}$/.test(normPhone(f.phone))) errs.push('Phone number looks incomplete. Include the country code, e.g. +972.');
    return errs;
  }

  // ---------- network ----------
  function api(action, data) {
    var body = Object.assign({ action: action, k: KEY }, data || {});
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (res) { if (!res.ok) { var e = new Error(res.error || 'Something went wrong.'); e.server = true; throw e; } return res; });
  }
  function saving(state, msg) {
    var el = $('save'); el.hidden = false;
    if (state === 'busy') { S.pending++; el.className = 'save busy'; el.textContent = 'Saving…'; }
    else {
      S.pending = Math.max(0, S.pending - 1);
      if (state === 'err') { el.className = 'save err'; el.textContent = 'Couldn’t save'; }
      else if (!S.pending) { el.className = 'save ok'; el.innerHTML = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Saved'; }
    }
  }
  function toast(msg, actLabel, act, bad) {
    var t = $('toast'); clearTimeout(toast.t);
    t.className = 'toast' + (bad ? ' bad' : '');
    t.innerHTML = '<span>' + esc(msg) + '</span>' + (actLabel ? '<button type="button">' + esc(actLabel) + '</button>' : '');
    if (actLabel) t.querySelector('button').onclick = function () { t.hidden = true; act(); };
    t.hidden = false; toast.t = setTimeout(function () { t.hidden = true; }, actLabel ? 7000 : 3200);
  }

  function load(silent) {
    if (!KEY) { $('gate').textContent = 'This link is missing its access code. Ask Noam for the full link.'; return Promise.resolve(); }
    return api('list').then(function (res) {
      S.guests = res.guests; S.who = res.who; S.admin = res.admin;
      $('couple').textContent = res.wedding.couple || 'Guest List';
      $('when').textContent = [fmtDate(res.wedding.date), res.wedding.place].filter(Boolean).join(' · ');
      $('who').textContent = 'Signed in as ' + res.who;
      $('addcol').hidden = !res.admin;
      $('refresh').hidden = false;
      document.title = 'Guest List – ' + (res.wedding.couple || 'Wedding');
      $('gate').hidden = true; $('app').hidden = false; $('fab').classList.add('show');
      if (!silent) { var s = $('save'); s.hidden = false; saving('ok'); }
      render();
    }).catch(function (e) {
      if (silent) return;
      $('gate').hidden = false; $('app').hidden = true;
      $('gate').textContent = e.server ? e.message : 'We couldn’t load the guest list. Check your connection and try Refresh.';
      $('refresh').hidden = false;
    });
  }

  // ---------- filtering ----------
  function filtered() {
    var q = S.q.trim().toLowerCase(), qd = q.replace(/\D/g, '');
    var list = S.guests.filter(function (g) {
      if (!!g.deleted !== S.trash) return false;
      if (S.status && g.status !== S.status) return false;
      if (S.age && g.age !== S.age) return false;
      if (S.group && g.group !== S.group) return false;
      if (!q) return true;
      if ((g.first + ' ' + g.last).toLowerCase().indexOf(q) > -1) return true;
      return qd.length > 2 && g.phone.replace(/\D/g, '').indexOf(qd.replace(/^0/, '')) > -1;
    });
    var k = S.sort.k, d = S.sort.dir;
    list.sort(function (a, b) {
      var x = a[k], y = b[k];
      if (k === 'no') return (x - y) * d;
      x = String(x || '').toLowerCase(); y = String(y || '').toLowerCase();
      if (x === y) return a.no - b.no;
      if (!x) return 1; if (!y) return -1;
      return (x < y ? -1 : 1) * d;
    });
    if (S.groupBy && !S.trash) {
      var order = [];
      list.forEach(function (g) { var n = g.group || '—'; if (order.indexOf(n) < 0) order.push(n); });
      var out = [];
      order.forEach(function (n) { list.forEach(function (g) { if ((g.group || '—') === n) out.push(g); }); });
      list = out;
    }
    return list;
  }

  // ---------- render ----------
  function render() {
    var L = live();
    var c = function (st) { return L.filter(function (g) { return g.status === st; }).length; };
    $('stats').innerHTML =
      '<div class="stat total"><span class="k">Total Guests</span><span class="v">' + L.length + '</span></div>' +
      STATUSES.map(function (st) {
        var col = { Confirmed: 'var(--ok)', Pending: 'var(--warn)', Tentative: 'var(--tent)', Declined: 'var(--bad)' }[st];
        return '<div class="stat"><span class="k" style="color:' + col + '">' + st + '</span><span class="v">' + c(st) + '</span></div>';
      }).join('');

    var groups = []; L.forEach(function (g) { if (g.group && groups.indexOf(g.group) < 0) groups.push(g.group); }); groups.sort();
    var fg = $('f-group'), cur = S.group;
    fg.innerHTML = '<option value="">Group: All</option>' + groups.map(function (n) { return '<option' + (n === cur ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('');
    $('groups').innerHTML = groups.map(function (n) { return '<option value="' + esc(n) + '"></option>'; }).join('');

    var del = S.guests.filter(function (g) { return g.deleted; }).length;
    $('trash').textContent = S.trash ? '← Back to guest list' : 'Deleted (' + del + ')';
    $('trash').classList.toggle('on', S.trash);
    $('groupby').classList.toggle('on', S.groupBy); $('groupby').setAttribute('aria-pressed', S.groupBy);

    var list = filtered();
    var base = S.trash ? del : L.length;
    $('showing').innerHTML = S.trash ? 'Deleted guests: <b>' + list.length + '</b> · restore anyone deleted by mistake'
      : 'Showing <b>' + list.length + '</b> of ' + base + ' guests';

    var nChecked = Object.keys(S.checked).filter(function (k) { return S.checked[k] && byNo(Number(k)) && !byNo(Number(k)).deleted; }).length;
    $('bulk').hidden = S.trash || !nChecked; $('bulk-n').textContent = nChecked + ' selected';

    renderTable(list); renderCards(list); renderPanel();
  }

  function cellHtml(g, c) {
    var v = g[c.k];
    if (c.k === 'status') return '<span class="pill ' + esc(v) + '">' + esc(v) + '</span>';
    if (c.k === 'phone') return '<span style="font-variant-numeric:tabular-nums">' + esc(prettyPhone(v)) + '</span>' + (v ? '<a class="wa" href="' + waLink(v) + '" target="_blank" rel="noopener" aria-label="WhatsApp ' + esc(g.first) + '" data-noedit="1"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-5.2A8.5 8.5 0 1 1 21 11.5z"></path></svg></a>' : '');
    if (c.k === 'first') return '<b>' + esc(v) + '</b>';
    if (!v && c.k === 'group') return '<span class="ph">—</span>';
    return esc(v);
  }

  function renderTable(list) {
    var cols = visibleCols();
    $('thead').innerHTML = '<th class="chk"><span class="sr">Select</span></th>' + cols.map(function (c) {
      var arrow = S.sort.k === c.k ? (S.sort.dir > 0 ? ' ↑' : ' ↓') : '';
      return '<th data-k="' + c.k + '" aria-sort="' + (S.sort.k === c.k ? (S.sort.dir > 0 ? 'ascending' : 'descending') : 'none') + '"><button type="button" data-sort="' + c.k + '">' + esc(c.label) + arrow + '</button></th>';
    }).join('') + '<th class="mo"><span class="sr">More</span></th>';
    var html = '', lastGroup = null;
    list.forEach(function (g) {
      if (S.groupBy && !S.trash && (g.group || '—') !== lastGroup) {
        lastGroup = g.group || '—';
        var n = list.filter(function (x) { return (x.group || '—') === lastGroup; }).length;
        html += '<tr class="grp"><td colspan="' + (cols.length + 2) + '">' + esc(lastGroup === '—' ? 'No group' : lastGroup) + ' · ' + n + (n === 1 ? ' guest' : ' guests') + '</td></tr>';
      }
      var cls = (S.open === g.no ? 'open-row' : (S.checked[g.no] ? 'sel-row' : ''));
      html += '<tr data-no="' + g.no + '" class="' + cls + '">' +
        '<td class="chk">' + (S.trash ? '' : '<input type="checkbox" data-check="' + g.no + '" aria-label="Select ' + esc(g.first + ' ' + g.last) + '"' + (S.checked[g.no] ? ' checked' : '') + '>') + '</td>' +
        cols.map(function (c) {
          var editable = !S.trash && !c.fixed;
          return '<td class="' + (c.k === 'no' ? 'num' : '') + (editable ? ' ed' : '') + '" data-k="' + c.k + '"' + (editable ? ' title="Click to edit"' : '') + '><div class="c">' + cellHtml(g, c) + '</div></td>';
        }).join('') +
        '<td>' + (S.trash ? '<button type="button" class="btn" data-restore="' + g.no + '" style="height:34px;margin-right:10px">Restore</button>'
          : '<button type="button" class="more" data-more="' + g.no + '" aria-label="More actions for ' + esc(g.first) + '">⋯</button>') + '</td></tr>';
    });
    $('tbody').innerHTML = html;
    $('empty').hidden = list.length > 0;
    $('empty').textContent = S.trash ? 'No deleted guests.' : 'No guests match these filters.';
  }

  function renderCards(list) {
    var html = '', lastGroup = null;
    list.forEach(function (g) {
      if (S.groupBy && !S.trash && (g.group || '—') !== lastGroup) { lastGroup = g.group || '—'; html += '<div class="grph">' + esc(lastGroup === '—' ? 'No group' : lastGroup) + '</div>'; }
      html += '<div class="card' + (S.checked[g.no] ? ' sel-row' : '') + '" data-card="' + g.no + '">' +
        '<div class="r1"><button type="button" class="nm" data-open="' + g.no + '">' + esc(g.first + ' ' + g.last) + '</button><span class="pill ' + esc(g.status) + '">' + esc(g.status) + '</span></div>' +
        '<div class="r2"><span>#' + g.no + ' · ' + esc(g.group || 'No group') + ' · ' + esc(g.age) + '</span>' +
        (S.trash ? '<button type="button" class="btn" data-restore="' + g.no + '" style="height:36px">Restore</button>'
          : (g.phone ? '<a class="wa" style="width:36px;height:36px;border:1px solid var(--hair)" href="' + waLink(g.phone) + '" target="_blank" rel="noopener" aria-label="WhatsApp ' + esc(g.first) + '"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-5.2A8.5 8.5 0 1 1 21 11.5z"></path></svg></a>' : '')) +
        '</div>' + (g.notes ? '<div class="nt">' + esc(g.notes) + '</div>' : '') + '</div>';
    });
    $('cards').innerHTML = html || '<div class="empty">' + (S.trash ? 'No deleted guests.' : 'No guests match these filters.') + '</div>';
  }

  // ---------- side panel ----------
  function renderPanel() {
    var p = $('panel'), g = S.open != null ? byNo(S.open) : null;
    if (!g || g.deleted) { p.hidden = true; return; }
    if (p.dataset.no === String(g.no) && !p.hidden && p.contains(document.activeElement) && document.activeElement.tagName !== 'BUTTON') return;
    p.dataset.no = g.no; p.hidden = false;
    var same = live().filter(function (x) { return x.phone && x.phone === g.phone && x.no !== g.no; });
    p.innerHTML =
      '<div class="hd"><div><div class="meta">Guest No. ' + g.no + (g.group ? ' · ' + esc(g.group) : '') + '</div><div class="name">' + esc(g.first + ' ' + g.last) + '</div></div>' +
      '<button type="button" class="x" id="p-close" aria-label="Close guest details">×</button></div>' +
      '<div class="two"><label class="f">First Name<input data-pf="first" value="' + esc(g.first) + '"></label><label class="f">Last Name<input data-pf="last" value="' + esc(g.last) + '"></label></div>' +
      '<label class="f">Phone<input data-pf="phone" type="tel" value="' + esc(prettyPhone(g.phone)) + '"></label>' +
      '<div class="two"><label class="f">Age Group<select data-pf="age">' + AGES.map(function (a) { return '<option' + (a === g.age ? ' selected' : '') + '>' + a + '</option>'; }).join('') + '</select></label>' +
      '<label class="f">RSVP Status<select data-pf="status">' + STATUSES.map(function (a) { return '<option' + (a === g.status ? ' selected' : '') + '>' + a + '</option>'; }).join('') + '</select></label></div>' +
      '<label class="f">Guest Group<input data-pf="group" list="groups" value="' + esc(g.group) + '"></label>' +
      '<label class="f">Notes<textarea data-pf="notes" rows="2">' + esc(g.notes) + '</textarea></label>' +
      (same.length ? '<div class="same">Same phone as:' + same.map(function (x) { return '<button type="button" data-open="' + x.no + '">' + esc(x.first + ' ' + x.last) + '</button>'; }).join('') + '</div>' : '') +
      '<div class="prow">' + (g.phone ? '<a class="btn" href="' + waLink(g.phone) + '" target="_blank" rel="noopener" style="text-decoration:none;color:var(--ok)">WhatsApp</a>' : '') +
      '<button type="button" class="btn" data-family="' + g.no + '">Add family member</button>' +
      '<button type="button" class="btn danger" data-delete="' + g.no + '">Delete guest</button></div>' +
      '<div class="hist"><h3>Activity</h3><div class="meta">Last updated: ' + esc(g.updated || '—') + '</div><div id="p-hist" class="meta">Loading…</div></div>';
    $('p-close').onclick = function () { S.open = null; render(); };
    var no = g.no;
    api('history', { no: no }).then(function (res) {
      var h = $('p-hist'); if (!h || S.open !== no) return;
      h.className = ''; h.innerHTML = res.items.length ? res.items.map(function (it) {
        return '<div class="it">' + esc(it.action + (it.details ? ': ' + it.details : '')) + '<span>' + esc(it.by + ' · ' + it.when) + '</span></div>';
      }).join('') : '<div class="meta">No changes yet.</div>';
    }).catch(function () { var h = $('p-hist'); if (h) h.textContent = 'Couldn’t load activity.'; });
  }

  $('panel').addEventListener('change', function (e) {
    var el = e.target.closest('[data-pf]'); if (!el || S.open == null) return;
    var f = {}; f[el.dataset.pf] = el.value; update(S.open, f);
  });
  $('panel').addEventListener('click', function (e) {
    var b = e.target.closest('[data-open],[data-family],[data-delete]'); if (!b) return;
    if (b.dataset.open) { S.open = Number(b.dataset.open); render(); }
    else if (b.dataset.family) openAdd(byNo(Number(b.dataset.family)));
    else if (b.dataset.delete) del([Number(b.dataset.delete)]);
  });

  // ---------- writes ----------
  function update(no, fields) {
    var g = byNo(no); if (!g) return;
    if ('phone' in fields) fields.phone = normPhone(fields.phone);
    var changed = {}; Object.keys(fields).forEach(function (k) { if (String(g[k]) !== String(fields[k]).trim()) changed[k] = String(fields[k]).trim(); });
    if (!Object.keys(changed).length) { render(); return; }
    var errs = validate(changed);
    if (errs.length) { toast(errs[0], null, null, true); S.open === no && ($('panel').dataset.no = ''); render(); return; }
    var before = Object.assign({}, g); Object.assign(g, changed); render();
    saving('busy');
    api('update', { no: no, fields: changed }).then(function (res) { Object.assign(g, res.guest); saving('ok'); if (S.open === no) { $('panel').dataset.no = ''; } render(); })
      .catch(function (e) { Object.assign(g, before); saving('err'); toast(e.server ? e.message : 'Couldn’t save. Check your connection and try again.', null, null, true); $('panel').dataset.no = ''; render(); });
  }
  function bulk(nos, fields) {
    var before = nos.map(function (n) { return Object.assign({}, byNo(n)); });
    nos.forEach(function (n) { Object.assign(byNo(n), fields); }); render();
    saving('busy');
    return api('bulk', { nos: nos, fields: fields }).then(function (res) { res.guests.forEach(function (x) { Object.assign(byNo(x.no), x); }); saving('ok'); toast('Updated ' + nos.length + (nos.length === 1 ? ' guest' : ' guests')); render(); })
      .catch(function (e) { before.forEach(function (b) { Object.assign(byNo(b.no), b); }); saving('err'); toast(e.server ? e.message : 'Couldn’t save. Try again.', null, null, true); render(); });
  }
  function del(nos) {
    nos.forEach(function (n) { byNo(n).deleted = true; delete S.checked[n]; });
    if (nos.indexOf(S.open) > -1) S.open = null;
    render(); saving('busy');
    api('delete', { nos: nos }).then(function () {
      saving('ok');
      var name = nos.length === 1 ? byNo(nos[0]).first + ' ' + byNo(nos[0]).last : nos.length + ' guests';
      toast('Deleted ' + name, 'Undo', function () { restore(nos); });
    }).catch(function (e) { nos.forEach(function (n) { byNo(n).deleted = false; }); saving('err'); toast(e.server ? e.message : 'Couldn’t delete. Try again.', null, null, true); render(); });
  }
  function restore(nos) {
    nos.forEach(function (n) { byNo(n).deleted = false; }); render(); saving('busy');
    api('restore', { nos: nos }).then(function () { saving('ok'); toast('Restored ' + (nos.length === 1 ? byNo(nos[0]).first + ' ' + byNo(nos[0]).last : nos.length + ' guests')); })
      .catch(function (e) { nos.forEach(function (n) { byNo(n).deleted = true; }); saving('err'); toast(e.server ? e.message : 'Couldn’t restore. Try again.', null, null, true); render(); });
  }

  // ---------- inline editing ----------
  function startEdit(td) {
    if (S.editing) return;
    var no = Number(td.parentNode.dataset.no), k = td.dataset.k, g = byNo(no);
    var c = COLS.filter(function (x) { return x.k === k; })[0];
    S.editing = { no: no, k: k };
    var box = td.querySelector('.c'), el;
    if (c.type === 'select') {
      el = document.createElement('select'); el.className = 'cell';
      c.opts.forEach(function (o) { var op = document.createElement('option'); op.textContent = o; if (o === g[k]) op.selected = true; el.appendChild(op); });
    } else {
      el = document.createElement('input'); el.className = 'cell'; el.value = k === 'phone' ? prettyPhone(g[k]) : g[k];
      if (c.type === 'group') el.setAttribute('list', 'groups');
      if (k === 'phone') el.type = 'tel';
    }
    el.setAttribute('aria-label', c.label);
    box.innerHTML = ''; box.appendChild(el); el.focus(); if (el.select) el.select();
    var done = false;
    function finish(save) {
      if (done) return; done = true; S.editing = null;
      if (save) { var f = {}; f[k] = el.value; update(no, f); } else render();
    }
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      else if (e.key === 'Tab') { e.preventDefault(); finish(true); }
    });
    el.addEventListener('blur', function () { finish(true); });
    if (c.type === 'select') el.addEventListener('change', function () { finish(true); });
  }

  $('tbody').addEventListener('click', function (e) {
    var t = e.target;
    if (t.closest('[data-noedit]')) return;
    var chk = t.closest('[data-check]'); if (chk) { S.checked[chk.dataset.check] = chk.checked; render(); return; }
    var more = t.closest('[data-more]'); if (more) { var r = more.getBoundingClientRect(); openMenu(Number(more.dataset.more), r.right - 240, r.bottom + 4); return; }
    var rs = t.closest('[data-restore]'); if (rs) { restore([Number(rs.dataset.restore)]); return; }
    var td = t.closest('td.ed'); if (td && !td.querySelector('.cell')) startEdit(td);
  });
  $('tbody').addEventListener('contextmenu', function (e) {
    var tr = e.target.closest('tr[data-no]'); if (!tr || S.trash || e.target.closest('.cell')) return;
    e.preventDefault(); openMenu(Number(tr.dataset.no), e.clientX, e.clientY);
  });
  $('thead').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sort]'); if (!b) return;
    var k = b.dataset.sort; S.sort = { k: k, dir: S.sort.k === k ? -S.sort.dir : 1 }; render();
  });

  // ---------- cards (mobile): tap opens, long-press menu ----------
  var lp = null, lpFired = false;
  $('cards').addEventListener('touchstart', function (e) {
    var c = e.target.closest('[data-card]'); if (!c || S.trash || e.target.closest('a')) return;
    lpFired = false;
    lp = setTimeout(function () { lpFired = true; if (navigator.vibrate) try { navigator.vibrate(10); } catch (x) {} openMenu(Number(c.dataset.card), 0, 0, true); }, 500);
  }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach(function (ev) { $('cards').addEventListener(ev, function () { clearTimeout(lp); }, { passive: true }); });
  $('cards').addEventListener('contextmenu', function (e) { var c = e.target.closest('[data-card]'); if (!c || S.trash) return; e.preventDefault(); if (!lpFired) openMenu(Number(c.dataset.card), e.clientX, e.clientY, true); });
  $('cards').addEventListener('click', function (e) {
    if (lpFired) { lpFired = false; e.preventDefault(); return; }
    var rs = e.target.closest('[data-restore]'); if (rs) { restore([Number(rs.dataset.restore)]); return; }
    if (e.target.closest('a')) return;
    var c = e.target.closest('[data-card]'); if (c && !S.trash) { S.open = Number(c.dataset.card); render(); }
  });

  // ---------- context menu ----------
  function targets(no) {
    var sel = Object.keys(S.checked).filter(function (k) { return S.checked[k]; }).map(Number).filter(function (n) { var g = byNo(n); return g && !g.deleted; });
    return sel.indexOf(no) > -1 && sel.length > 1 ? sel : [no];
  }
  function openMenu(no, x, y, sheet) {
    var g = byNo(no); if (!g) return;
    var nos = targets(no), many = nos.length > 1;
    var m = $('menu');
    m.className = 'menu' + (sheet ? ' sheet' : '');
    m.innerHTML = '<div class="mh">' + (many ? nos.length + ' selected guests' : esc(g.first + ' ' + g.last) + ' · #' + g.no) + '</div>' +
      (many ? '' : '<button type="button" class="mi" role="menuitem" data-m="open">Open details</button>') +
      '<div class="mh">Change status</div><div class="seg">' + STATUSES.map(function (s) { return '<button type="button" data-m="status" data-v="' + s + '" class="' + (!many && g.status === s ? 'cur' : '') + '">' + s + '</button>'; }).join('') + '</div>' +
      '<div class="mh">Change age group</div><div class="seg">' + AGES.map(function (s) { return '<button type="button" data-m="age" data-v="' + s + '" class="' + (!many && g.age === s ? 'cur' : '') + '">' + s + '</button>'; }).join('') + '</div>' +
      '<hr><button type="button" class="mi" role="menuitem" data-m="group">Assign to group…</button>' +
      (many ? '' : '<button type="button" class="mi" role="menuitem" data-m="family">Add family member</button>' +
        (g.phone ? '<button type="button" class="mi" role="menuitem" data-m="wa">WhatsApp</button><button type="button" class="mi" role="menuitem" data-m="copy">Copy phone</button>' : '')) +
      '<hr><button type="button" class="mi del" role="menuitem" data-m="delete">' + (many ? 'Delete ' + nos.length + ' guests' : 'Delete') + '</button>';
    m.hidden = false; $('scrim').hidden = false;
    if (!sheet || window.innerWidth >= 760) {
      var w = m.offsetWidth, h = m.offsetHeight;
      m.style.left = Math.max(8, Math.min(x, window.innerWidth - w - 8)) + 'px';
      m.style.top = Math.max(8, Math.min(y, window.innerHeight - h - 8)) + 'px';
    }
    m.dataset.nos = nos.join(',');
    var first = m.querySelector('button'); if (first) first.focus();
  }
  function closeMenu() { $('menu').hidden = true; $('scrim').hidden = true; }
  $('scrim').addEventListener('click', closeMenu);
  $('scrim').addEventListener('contextmenu', function (e) { e.preventDefault(); closeMenu(); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('menu').hidden) closeMenu();
    else if (!$('dlg').hidden) $('dlg').hidden = true;
    else if (!$('dlg2').hidden) $('dlg2').hidden = true;
  });
  $('menu').addEventListener('click', function (e) {
    var b = e.target.closest('[data-m]'); if (!b) return;
    var nos = $('menu').dataset.nos.split(',').map(Number), g = byNo(nos[0]), a = b.dataset.m;
    closeMenu();
    if (a === 'open') { S.open = g.no; render(); }
    else if (a === 'status' || a === 'age') { var f = {}; f[a] = b.dataset.v; if (nos.length > 1) bulk(nos, f); else update(g.no, f); }
    else if (a === 'group') pickGroup(nos);
    else if (a === 'family') openAdd(g);
    else if (a === 'wa') window.open(waLink(g.phone), '_blank', 'noopener');
    else if (a === 'copy') copy(g.phone);
    else if (a === 'delete') del(nos);
  });
  function copy(text) {
    var done = function () { toast('Phone copied'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
    function fallback() { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (x) { toast(text); } ta.remove(); }
  }

  // ---------- pick dialog (group / bulk status / bulk age) ----------
  var pickApply = null;
  function pick(title, bodyHtml, apply) {
    $('pick-title').textContent = title; $('pick-body').innerHTML = bodyHtml; $('pick-err').hidden = true;
    pickApply = apply; $('dlg2').hidden = false;
    var f = $('pick-body').querySelector('input,select'); if (f) f.focus();
  }
  function pickGroup(nos) {
    var cur = nos.length === 1 ? byNo(nos[0]).group : '';
    pick(nos.length > 1 ? 'Assign ' + nos.length + ' guests to a group' : 'Assign to group',
      '<label class="f">Guest Group<input id="pick-in" list="groups" value="' + esc(cur) + '" placeholder="e.g. Cohen Family"></label>',
      function () { var v = $('pick-in').value.trim(); if (nos.length > 1) bulk(nos, { group: v }); else update(nos[0], { group: v }); });
  }
  $('pickform').addEventListener('submit', function (e) { e.preventDefault(); $('dlg2').hidden = true; if (pickApply) pickApply(); });
  $('pick-cancel').addEventListener('click', function () { $('dlg2').hidden = true; });

  $('bulk').addEventListener('click', function (e) {
    var b = e.target.closest('[data-bulk]'); if (!b) return;
    var nos = Object.keys(S.checked).filter(function (k) { return S.checked[k]; }).map(Number).filter(function (n) { return byNo(n) && !byNo(n).deleted; });
    var a = b.dataset.bulk;
    if (a === 'clear') { S.checked = {}; render(); }
    else if (a === 'delete') del(nos);
    else if (a === 'group') pickGroup(nos);
    else if (a === 'status' || a === 'age') {
      var opts = a === 'status' ? STATUSES : AGES;
      pick((a === 'status' ? 'Change status for ' : 'Change age group for ') + nos.length + ' guests',
        '<label class="f">' + (a === 'status' ? 'RSVP Status' : 'Age Group') + '<select id="pick-in">' + opts.map(function (o) { return '<option>' + o + '</option>'; }).join('') + '</select></label>',
        function () { var f = {}; f[a] = $('pick-in').value; bulk(nos, f); });
    }
  });

  // ---------- add guest ----------
  function openAdd(from) {
    $('dlg-title').textContent = from ? 'Add family member' : 'Add Guest';
    ['a-first', 'a-last', 'a-notes'].forEach(function (id) { $(id).value = ''; });
    $('a-phone').value = from ? prettyPhone(from.phone) : '';
    $('a-group').value = from ? from.group : '';
    $('a-age').value = 'Adult'; $('a-status').value = from ? from.status : 'Pending';
    $('a-err').hidden = true; $('dlg').hidden = false; $('a-first').focus();
  }
  function submitAdd(another) {
    var f = { first: $('a-first').value.trim(), last: $('a-last').value.trim(), phone: $('a-phone').value.trim(),
      age: $('a-age').value, status: $('a-status').value, group: $('a-group').value.trim(), notes: $('a-notes').value.trim() };
    var errs = validate(f);
    if (errs.length) { $('a-err').textContent = errs.join(' '); $('a-err').hidden = false; return; }
    f.phone = normPhone(f.phone);
    ['a-save', 'a-another'].forEach(function (id) { $(id).disabled = true; });
    saving('busy');
    api('add', { guest: f }).then(function (res) {
      S.guests.push(res.guest); saving('ok'); toast('Added ' + res.guest.first + ' ' + res.guest.last + ' as Guest No. ' + res.guest.no);
      if (another) { $('a-first').value = ''; $('a-notes').value = ''; $('a-err').hidden = true; $('a-first').focus(); $('dlg-title').textContent = 'Add family member'; }
      else $('dlg').hidden = true;
      render();
    }).catch(function (e) { saving('err'); $('a-err').textContent = e.server ? e.message : 'Couldn’t save. Check your connection and try again.'; $('a-err').hidden = false; })
      .then(function () { ['a-save', 'a-another'].forEach(function (id) { $(id).disabled = false; }); });
  }
  $('addform').addEventListener('submit', function (e) { e.preventDefault(); submitAdd(false); });
  $('a-another').addEventListener('click', function () { submitAdd(true); });
  $('a-cancel').addEventListener('click', function () { $('dlg').hidden = true; });
  $('add').addEventListener('click', function () { openAdd(null); });
  $('fab').addEventListener('click', function () { openAdd(null); });

  // ---------- columns ----------
  $('columns').addEventListener('click', function () {
    function body() {
      return S.cols.order.map(function (k, i) {
        var c = COLS.filter(function (x) { return x.k === k; })[0];
        return '<div class="colrow"><label><input type="checkbox" data-col="' + k + '"' + (S.cols.hidden.indexOf(k) < 0 ? ' checked' : '') + (c.fixed ? ' disabled' : '') + '>' + esc(c.label) + '</label>' +
          '<button type="button" data-up="' + i + '" aria-label="Move ' + esc(c.label) + ' up"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
          '<button type="button" data-down="' + i + '" aria-label="Move ' + esc(c.label) + ' down"' + (i === S.cols.order.length - 1 ? ' disabled' : '') + '>↓</button></div>';
      }).join('') + '<p class="meta" style="margin:8px 0 0;font-size:13px;color:var(--soft)">Hiding a column only hides it on this device. No data is deleted.</p>';
    }
    pick('Columns', body(), function () {});
    $('pick-ok').textContent = 'Done';
    $('pick-body').onclick = function (e) {
      var up = e.target.closest('[data-up]'), dn = e.target.closest('[data-down]'), o = S.cols.order;
      if (up) { var i = Number(up.dataset.up); o.splice(i - 1, 0, o.splice(i, 1)[0]); }
      else if (dn) { var j = Number(dn.dataset.down); o.splice(j + 1, 0, o.splice(j, 1)[0]); }
      else return;
      saveCols(); $('pick-body').innerHTML = body(); render();
    };
    $('pick-body').onchange = function (e) {
      var cb = e.target.closest('[data-col]'); if (!cb) return;
      var k = cb.dataset.col, h = S.cols.hidden;
      if (cb.checked) S.cols.hidden = h.filter(function (x) { return x !== k; }); else if (h.indexOf(k) < 0) h.push(k);
      saveCols(); render();
    };
  });
  $('dlg2').addEventListener('transitionend', function () {});
  var pickObserver = new MutationObserver(function () { if ($('dlg2').hidden) { $('pick-ok').textContent = 'Apply'; $('pick-body').onclick = null; $('pick-body').onchange = null; } });
  pickObserver.observe($('dlg2'), { attributes: true, attributeFilter: ['hidden'] });

  // ---------- export ----------
  $('export').addEventListener('click', function () {
    var cols = visibleCols(), list = filtered();
    var cell = function (v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var csv = [cols.map(function (c) { return c.label; }).join(',')].concat(list.map(function (g) {
      return cols.map(function (c) { return cell(c.k === 'phone' ? prettyPhone(g.phone) : g[c.k]); }).join(',');
    })).join('\r\n');
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'Guest List - ' + ($('couple').textContent || 'Wedding') + (S.trash ? ' (deleted)' : '') + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Exported ' + list.length + ' guests');
  });

  // ---------- filters & toggles ----------
  $('q').addEventListener('input', function () { S.q = this.value; render(); });
  $('f-status').addEventListener('change', function () { S.status = this.value; render(); });
  $('f-age').addEventListener('change', function () { S.age = this.value; render(); });
  $('f-group').addEventListener('change', function () { S.group = this.value; render(); });
  $('groupby').addEventListener('click', function () { S.groupBy = !S.groupBy; render(); });
  $('trash').addEventListener('click', function () { S.trash = !S.trash; S.open = null; S.checked = {}; render(); });
  $('refresh').addEventListener('click', function () { load(false); });
  window.addEventListener('hashchange', function () { KEY = location.hash.replace(/^#/, ''); load(false); });

  // Quiet refresh so changes by the other side show up.
  setInterval(function () {
    if (document.visibilityState !== 'visible' || S.editing || S.pending || !$('dlg').hidden || !$('dlg2').hidden || !$('menu').hidden) return;
    var p = $('panel'); if (!p.hidden && p.contains(document.activeElement)) return;
    load(true);
  }, 30000);

  loadCols();
  load(false);
})();
</script>
</body>
</html>
