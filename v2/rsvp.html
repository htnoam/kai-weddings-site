<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>You’re invited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Bellefair&family=Ephesis&family=Gveret+Levin&family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Assistant:wght@400;500;600&display=swap">
<style>
/* Linen table, one white card laid on it. Spaced serif caps + a loose script (Hebrew falls through to Gveret Levin / Frank Ruhl),
   near-black type, cobalt only where the sea is: the photo washes up into the card from the bottom. */
:root {
  --linen: #E9E3D8;
  --card: #FCFBF8;
  --field: #FFFFFF;
  --ink: #2E3A9E;
  --text: #1F1F21;
  --muted: #4A4A50;
  --soft: #77777E;
  --line: #D6D4CE;
  --hair: #E4E1DA;
  --display: 'Ephesis', 'Gveret Levin', cursive;
  --serif: 'Cormorant Garamond', 'Frank Ruhl Libre', Georgia, serif;
  --sans: 'Assistant', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { color: var(--text); font-family: var(--sans); font-variant-numeric: lining-nums; direction: rtl;
  background-color: var(--linen);
  background-image:
    radial-gradient(60% 30% at 18% 22%, rgba(255,255,255,.45), transparent 70%),
    radial-gradient(50% 26% at 85% 64%, rgba(120,100,75,.10), transparent 70%),
    radial-gradient(70% 20% at 40% 88%, rgba(255,255,255,.35), transparent 70%),
    repeating-linear-gradient(0deg, rgba(110,95,75,.05) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(110,95,75,.04) 0 1px, transparent 1px 4px),
    url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27220%27%20height%3D%27220%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.85%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27/%3E%3CfeColorMatrix%20values%3D%270%200%200%200%20.42%200%200%200%200%20.37%200%200%200%200%20.30%200%200%200%20.22%200%27/%3E%3C/filter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27/%3E%3C/svg%3E"); }
.page { max-width: 460px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 30px 30px; display: flex; flex-direction: column; }
.sheet, .panel { background: var(--card) url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27180%27%20height%3D%27180%27%3E%3Cfilter%20id%3D%27g%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%271.1%27%20numOctaves%3D%271%27%20stitchTiles%3D%27stitch%27/%3E%3CfeColorMatrix%20values%3D%270%200%200%200%20.5%200%200%200%200%20.47%200%200%200%200%20.42%200%200%200%20.07%200%27/%3E%3C/filter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23g%29%27/%3E%3C/svg%3E"); border-radius: 2px;
  box-shadow: 0 1px 2px rgba(60,48,30,.10), 0 30px 40px -26px rgba(60,48,30,.50), 0 0 0 1px rgba(60,48,30,.04); }
.caps { font-family: var(--serif); font-weight: 500; font-size: 13px; letter-spacing: .26em; text-transform: uppercase; color: var(--text); }

/* ---------- envelope intro (pure CSS, tap to open) ---------- */
.env-toggle { position: fixed; top: 0; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
body:has(#open-env:not(:checked)) { overflow: hidden; }
.env-screen { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: inherit; background-color: var(--linen); color: var(--text); transition: opacity .8s ease 1.7s, visibility 0s linear 2.5s; }
#open-env:checked ~ .env-screen { opacity: 0; visibility: hidden; pointer-events: none; }
.env-hit { display: flex; flex-direction: column; align-items: center; gap: 22px; cursor: pointer; -webkit-tap-highlight-color: transparent; padding: 24px; text-align: center; }
.env-hello { display: block; font-family: var(--display); font-size: clamp(54px, 16vw, 68px); line-height: 1; transition: opacity .3s; }
.env-cta { display: block; transition: opacity .3s; }
#open-env:checked ~ .env-screen .env-hello, #open-env:checked ~ .env-screen .env-cta { opacity: 0; }
#open-env:focus-visible ~ .env-screen .env { outline: 1px solid var(--ink); outline-offset: 12px; }
.env { position: relative; display: block; width: min(320px, 80vw); aspect-ratio: 3 / 2; perspective: 900px; margin-top: 50px; animation: bob 3.4s ease-in-out infinite; }
#open-env:checked ~ .env-screen .env { animation: none; }
@keyframes bob { 50% { transform: translateY(-5px) rotate(-.6deg); } }
.env-back { position: absolute; inset: 0; border-radius: 2px; background: #F4F2EE; box-shadow: 0 26px 34px -16px rgba(60,48,30,.5); }
.env-card { position: absolute; inset: 7% 6% 6%; z-index: 2; display: flex; flex-direction: column; align-items: center; padding-top: 10%; gap: 6px; background: var(--card); color: var(--text); transition: transform .8s cubic-bezier(.2,.8,.2,1) .5s; }
.env-card b { font: 400 30px/1 var(--display); white-space: nowrap; }
.env-card i { font-style: normal; font-size: 11px; }
#open-env:checked ~ .env-screen .env-card { transform: translateY(-58%); }
.env-front { position: absolute; inset: 0; z-index: 3; border-radius: 2px; background: linear-gradient(165deg, #FFFFFF, #EFEDE8); clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%); }
.env-flap { position: absolute; inset: 0 0 auto; height: 60%; z-index: 4; transform-origin: top; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.4,0,.2,1), z-index 0s linear .3s; }
.flap-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; clip-path: polygon(0 0, 100% 0, 50% 100%); }
.flap-out { background: linear-gradient(180deg, #FFFFFF 30%, #E6E2DA); }
.flap-in { background: #fff repeating-linear-gradient(-58deg, rgba(46,58,158,.55) 0 1px, transparent 1px 5px); transform: rotateX(180deg); clip-path: polygon(50% 0, 0 100%, 100% 100%); }
#open-env:checked ~ .env-screen .env-flap { transform: rotateX(180deg); z-index: 1; }
.env-seal { position: absolute; left: 50%; top: 58%; z-index: 5; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 48% 52% 50% 50% / 52% 48% 52% 48%; display: grid; place-items: center; background: radial-gradient(circle at 36% 30%, #5F6BD0, var(--ink) 55%, #1C2470); box-shadow: 0 3px 7px rgba(0,0,0,.3), inset 0 0 0 5px rgba(255,255,255,.08); color: #E6E9FB; font: 400 26px/1 var(--display); transition: opacity .25s, transform .25s; }
.env-seal::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 1px solid rgba(230,233,251,.35); }
#open-env:checked ~ .env-screen .env-seal { opacity: 0; transform: scale(.6); }

/* ---------- invitation sheet ---------- */
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 46px 28px 0; overflow: hidden; transform: rotate(-.8deg); }
.title { margin: 0; font-family: var(--serif); font-weight: 500; font-size: clamp(15px, 4.6vw, 21px); line-height: 1.25; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.title em { font-family: var(--display); font-style: normal; text-transform: none; letter-spacing: 0; font-size: 1.35em; margin: 0 .12em; vertical-align: -.06em; }
.lead { margin: 20px 6px 0; font-family: var(--serif); font-size: 18px; line-height: 1.5; color: var(--muted); text-wrap: balance; }
.when { margin-top: 64px; font-family: var(--serif); font-weight: 500; font-size: clamp(16px, 4.8vw, 19px); letter-spacing: .2em; white-space: nowrap; }
.hero .caps.day { margin-top: 12px; font-size: 12px; white-space: nowrap; }
.hero .caps.where { margin-top: 6px; font-size: 12px; }
.script { margin-top: 74px; font-family: var(--display); font-size: 34px; line-height: 1; color: var(--ink); transform: rotate(-3deg); }
.sea { position: relative; z-index: 0; width: calc(100% + 56px); margin: -40px -28px 0; }
/* Hebrew: no wide letter spacing or capitals (they break Hebrew letters apart); the script line sits in the white fade, above the photo's faces. */
html[lang="he"] .title { letter-spacing: .02em; }
html[lang="he"] .title em { margin: 0 .08em 0 0; }
html[lang="he"] .caps { letter-spacing: .03em; font-size: 15px; }
html[lang="he"] .hero .caps.day { font-size: 15px; }
html[lang="he"] .hero .caps.where { letter-spacing: .2em; font-size: 12px; }
html[lang="he"] .script { margin-top: 40px; font-size: 38px; transform: rotate(-2deg); }
.hero .script { margin-bottom: 4px; }
.sea img { display: block; width: 100%; height: auto; mix-blend-mode: multiply;
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.25) 12%, rgba(0,0,0,.75) 22%, #000 30%);
          mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.25) 12%, rgba(0,0,0,.75) 22%, #000 30%); }
.hero > :not(.sea) { position: relative; z-index: 1; }
.intro { margin: 30px 0 0; text-align: center; font-size: 12px; }
.intro strong { font-weight: 600; }
#open-env:checked ~ .page .hero > * { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
#open-env:checked ~ .page .hero > :nth-child(1) { animation-delay: 1.9s; }
#open-env:checked ~ .page .hero > :nth-child(n+2) { animation-delay: 2.1s; }
#open-env:checked ~ .page .hero > .sea { animation: wash 1.6s ease both 2.2s; }
@keyframes rise { from { opacity: 0; translate: 0 12px; } }
@keyframes wash { from { opacity: 0; } }

/* ---------- RSVP (Hebrew) ---------- */
.panel { margin-top: 26px; padding: 32px 20px; display: flex; flex-direction: column; gap: 22px; }
h2 { margin: 0; font-family: var(--sans); font-weight: 400; font-size: 18px; line-height: 1.55; letter-spacing: .01em; text-align: center; color: var(--text); text-wrap: balance; }
.h2-ask { display: block; margin-top: 12px; font-weight: 600; font-size: 22px; letter-spacing: .02em; }
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.lbl { font-size: 14px; font-weight: 500; color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
input[type=text], input[type=tel], textarea { width: 100%; min-width: 0; height: 48px; border: 1px solid var(--line); border-radius: 2px; padding: 0 14px; font: 17px var(--sans); background: var(--field); color: var(--text); }
input[type=tel] { text-align: right; }
textarea { height: auto; padding: 12px 14px; resize: none; }
input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.opt { min-height: 48px; border-radius: 2px; border: 1px solid var(--line); background: var(--field); color: var(--text); font: 15px var(--sans); cursor: pointer; padding: 4px; }
.opt[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #fff; }
.opt small { display: block; font-size: 12px; }
.count { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stepper { display: flex; align-items: center; gap: 14px; }
.round { width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--field); font-size: 20px; color: var(--ink); cursor: pointer; }
.num { font-family: var(--sans); font-weight: 500; font-size: 26px; min-width: 22px; text-align: center; color: var(--text); font-variant-numeric: lining-nums tabular-nums; }
.hint { font-size: 13px; color: var(--soft); }
.divider { display: flex; align-items: center; gap: 12px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--hair); }
.divider span { font-family: var(--sans); font-size: 14px; font-weight: 500; color: var(--muted); }
.companions { display: flex; flex-direction: column; gap: 12px; }
.comp { border: 1px solid var(--hair); border-radius: 2px; background: var(--field); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.comp-title { font-family: var(--sans); font-weight: 600; font-size: 15px; color: var(--text); }
.comp input { height: 44px; padding: 0 12px; }
.comp .seg { gap: 6px; }
.comp .opt { min-height: 52px; }
.comp .seg:has(> :nth-child(4)) { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.send { height: 54px; border: none; border-radius: 2px; background: var(--text); color: #fff; font: 500 17px var(--sans); letter-spacing: .04em; cursor: pointer; }
.err { margin: -10px 0 0; font-size: 14px; color: #9B2C2C; }
.thanks { align-items: center; text-align: center; gap: 12px; padding: 40px 24px; }
.thanks .big { font-family: var(--sans); font-weight: 500; font-size: 28px; line-height: 1.2; color: var(--text); }
.privacy { margin: -6px 0 0; text-align: center; font-family: var(--sans); font-size: 12.5px; color: var(--muted, #6B6B6B); }
.recap { display: flex; flex-direction: column; gap: 2px; font-family: var(--sans); font-size: 15px; line-height: 1.5; padding: 12px 16px; border-radius: 6px; background: rgba(60,48,30,.05); width: 100%; }
.self-wa { text-decoration: underline; text-underline-offset: 3px; }
body.no-env .env-screen { display: none; }
body.no-env .page .hero > * { animation: none !important; }
.thanks p { margin: 0; font-family: var(--sans); font-size: 17px; line-height: 1.6; }
.to-portal { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 6px; padding-top: 14px; border-top: 1px solid rgba(0,0,0,.08); }
.to-portal p { font-size: 15px !important; }
.to-portal .send { display: grid; place-items: center; text-decoration: none; }
.link-btn { background: none; border: none; color: var(--ink); text-decoration: underline; font: 15px var(--sans); cursor: pointer; min-height: 44px; }

/* ---------- footer ---------- */
footer { padding: 40px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
footer p { margin: 0; font-family: var(--serif); font-size: 19px; line-height: 1.5; color: var(--text); }
.wa { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; border: 1px solid var(--text); border-radius: 2px; color: var(--text); text-decoration: none; font: 500 12px var(--serif); letter-spacing: .24em; text-transform: uppercase; }
.kai { font-family: var(--serif); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
/* questions: one row between two hairlines, the text on one side and the two buttons on the other */
.f-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 4px; border-top: 1px solid var(--gold, var(--line)); border-bottom: 1px solid var(--gold, var(--line)); }
.f-who { display: flex; flex-direction: column; gap: 2px; text-align: start; }
.f-who b { font: 400 18px 'Frank Ruhl Libre', var(--serif); color: var(--text); }
.f-who span { font: 400 14px/1.45 'Frank Ruhl Libre', var(--serif); color: var(--muted); text-wrap: balance; }
.f-btns { display: flex; gap: 10px; flex-shrink: 0; }
.f-btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--text); color: var(--text); font: 400 15px 'Frank Ruhl Libre', var(--serif); text-decoration: none; }
.f-icon { width: 44px; padding: 0; }
.t-sage .f-btn { background: #C8D5C7; border: 1px solid rgba(110,130,110,.22); color: #2C3B31; }

@media (prefers-reduced-motion: reduce) {
  .env, .env-card, .env-flap, .env-seal, .env-screen { animation: none !important; transition-duration: .01s !important; transition-delay: 0s !important; }
  #open-env:checked ~ .page .hero > * { animation: none !important; }
}

/* ---------- shared template additions ---------- */
html, body { margin: 0; padding: 0; }
html[dir=ltr] body { direction: ltr; }
html[dir=ltr] input[type=tel] { text-align: left; }
.lang { position: absolute; z-index: 60; top: max(8px, env(safe-area-inset-top, 0px)); inset-inline-end: max(10px, env(safe-area-inset-right, 0px), calc(50% - 222px)); display: flex; }
.lang button { min-height: 40px; padding: 0 10px; border: none; background: transparent; font: 400 13px 'Cormorant Garamond', 'Bellefair', serif; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); cursor: pointer; }
.lang button[data-lang="he"] { font-family: 'Bellefair', serif; font-size: 14px; letter-spacing: .02em; }
.lang button[aria-pressed=true] { display: none; }
.page { padding-top: 58px; }
.hero.no-photo { padding-bottom: 46px; }
.hosting { margin-top: -6px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding-bottom: 22px; border-bottom: 1px solid var(--hair); }
.hosting .h-title { font-size: 19px; font-weight: 600; color: var(--text); }
.hosting .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.hosting .chips span { padding: 6px 14px; border-radius: 999px; background: #F1EFEA; border: 1px solid var(--hair); font-size: 14px; font-weight: 500; color: var(--text); }
.hosting .h-text { margin: 0; font-size: 16px; line-height: 1.6; color: var(--muted); text-wrap: balance; }
.hosting .h-note { margin: 0; font-size: 13px; line-height: 1.5; color: var(--soft); text-wrap: balance; }
.hero .caps.day { white-space: normal; text-wrap: balance; }
.names-hint { margin: -12px 0 0; font-size: 13px; color: var(--soft); }
/* "Magazine" first page (event setting Hero Layout = Magazine): the whole photo on top, uncropped, then the names and the details under it. */
.kicker, .names, .rule, .cue { display: none; }
.hero.mag { transform: none; padding: 0 26px 30px; }
.hero.mag .sea { order: -1; width: calc(100% + 52px); margin: 0 -26px 26px; }
.hero.mag .sea img { mix-blend-mode: normal; -webkit-mask-image: none; mask-image: none; }
.hero.mag.no-photo { padding-top: 46px; }
.hero.mag .kicker { display: block; order: 1; font: 400 12px 'Cormorant Garamond', 'Bellefair', serif; letter-spacing: .32em; text-transform: uppercase; color: #8A8176; }
html[lang="he"] .hero.mag .kicker { font: 400 15px 'Bellefair', serif; letter-spacing: .02em; }
.hero.mag .names { display: block; order: 2; margin-top: 10px; font: 400 clamp(40px, 13vw, 52px)/1.1 'Bellefair', 'Cormorant Garamond', serif; letter-spacing: .02em; color: var(--text); }
.hero.mag .names i { font: italic 300 .95em 'Cormorant Garamond', serif; color: var(--ink); margin: 0 .1em; }
.hero.mag .title { order: 3; margin-top: 12px; font-family: var(--display); font-size: 34px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ink); transform: rotate(-2deg); white-space: normal; }
.hero.mag .title em { font-size: 1em; margin: 0; vertical-align: 0; }
.hero.mag .rule { display: block; order: 4; width: 48px; height: 1px; margin-top: 22px; background: var(--line, #CFC8BC); }
.hero.mag .when { order: 5; margin-top: 20px; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(19px, 6vw, 24px); letter-spacing: .14em; }
.hero.mag .caps.day { order: 6; margin-top: 8px; font: 400 17px 'Cormorant Garamond', serif; letter-spacing: .02em; text-transform: none; color: var(--muted); }
html[lang="he"] .hero.mag .caps.day { font: 400 16px 'Bellefair', serif; }
.hero.mag .caps.where { order: 7; margin-top: 8px; font: 400 12px 'Cormorant Garamond', serif; letter-spacing: .3em; color: var(--muted); }
.hero.mag .script { display: none; }
.hero.mag .cue { order: 8; margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 400 14px var(--sans); letter-spacing: .02em; color: #5C554D; text-decoration: none; }
/* ---------- theme "Sage" (Settings › Theme = Sage) ---------- */
body.t-sage { --linen: #F4EFE8; --card: #FAF7F2; --ink: #3F5D49; --text: #2C3F33; --muted: #5E6B60; --soft: #8C958C; --line: #D9DDD3; --hair: #E6E3DA; --gold: #C9B99B; --sage: #8FA48F; --mint: #CFDECF;
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27220%27%20height%3D%27220%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27/%3E%3CfeColorMatrix%20values%3D%270%200%200%200%20.45%200%200%200%200%20.42%200%200%200%200%20.38%200%200%200%20.10%200%27/%3E%3C/filter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27/%3E%3C/svg%3E"); }
.t-sage .sheet, .t-sage .panel { border-radius: 18px; box-shadow: 0 0 0 1px rgba(201,185,155,.55), 0 24px 36px -28px rgba(60,70,50,.45); }
.env-top, .env-tap { display: none; }
.env-hit { opacity: 0; transition: opacity .35s; }
body.ready .env-hit { opacity: 1; }

  <form id="rsvp" class="panel" novalidate>

      <div class="chips" id="ho-chips"></div>
      <p class="h-text" id="ho-text"></p>
      <p class="h-note" id="ho-note"></p>
    </div>
    <div class="two">
      <div class="field"><label class="lbl" for="first" data-t="first"></label><input id="first" type="text" autocomplete="given-name" placeholder="Dana"></div>
      <div class="field"><label class="lbl" for="last" data-t="last"></label><input id="last" type="text" autocomplete="family-name" placeholder="Levi"></div>
    </div>
    <p class="names-hint" data-t="namesHint"></p>
    <div class="field"><label class="lbl" for="phone" data-t="phone"></label><input id="phone" type="tel" dir="ltr" autocomplete="tel" placeholder="050-0000000"></div>

    <div class="field">
      <div class="lbl" id="attend-lbl" data-t="attendQ"></div>
      <div class="seg" role="group" aria-labelledby="attend-lbl" id="attend">
        <button type="button" class="opt" data-v="yes" aria-pressed="true" data-t="yes"></button>
        <button type="button" class="opt" data-v="no" aria-pressed="false" data-t="no"></button>
        <button type="button" class="opt" data-v="maybe" aria-pressed="false" data-t="maybe"></button>
      </div>
    </div>

    <div id="coming" style="display:flex;flex-direction:column;gap:22px">
      <div class="count">
        <div><div class="lbl" data-t="guests"></div><div class="hint" data-t="incl"></div></div>
        <div class="stepper">
          <button type="button" class="round" id="inc">+</button>
          <div class="num" id="guests" aria-live="polite">2</div>
          <button type="button" class="round" id="dec">−</button>
        </div>
      </div>
      <div id="comp-wrap" class="companions">
        <div class="divider"><span data-t="withYou"></span></div>
        <div id="comp-list" class="companions"></div>
      </div>
    </div>

    <div class="field"><label class="lbl" for="note" data-t="note"></label><textarea id="note" rows="3"></textarea></div>
    <p class="err" id="err" hidden></p>
    <button type="submit" class="send" data-t="send"></button>
    <p class="privacy" data-t="privacy"></p>
  </form>

  <section id="thanks" class="panel thanks" hidden>
    <div class="big" data-t="thanksBig"></div>
    <p id="thanks-text"></p>
    <div class="recap" id="recap"></div>
    <a class="link-btn self-wa" id="self-wa" href="#" target="_blank" rel="noopener" data-t="selfWa"></a>

    <button type="button" class="link-btn" id="edit" data-t="edit"></button>

  </footer>
</div>

  function datesLine(typed, start, end) {
    var p = function (s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '') || /^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/.exec(s || ''); if (!m) return null; return m[1].length === 4 ? { d: m[3], m: m[2], y: m[1] } : { d: ('0' + m[1]).slice(-2), m: ('0' + m[2]).slice(-2), y: m[3] }; };
    var two = /^\s*(\d{1,2}[.\/]\d{1,2}[.\/]\d{4})\s*[-–—]\s*(\d{1,2}[.\/]\d{1,2}[.\/]\d{4})\s*$/.exec(typed || '');
    var a, b;
    if (typed && !two) return typed;
    if (two) { a = p(two[1]); b = p(two[2]); } else { a = p(start); b = p(end); }
    if (!a || !b) return typed || '';
    if (a.y === b.y && a.m === b.m) return a.d === b.d ? a.d + ' . ' + a.m + ' . ' + a.y : a.d + ' – ' + b.d + ' . ' + a.m + ' . ' + a.y;
    if (a.y === b.y) return a.d + ' . ' + a.m + ' – ' + b.d + ' . ' + b.m + ' . ' + a.y;
    return a.d + ' . ' + a.m + ' . ' + a.y + ' – ' + b.d + ' . ' + b.m + ' . ' + b.y;
  }

  function apply() {
    var t = T[L];
    document.documentElement.lang = L; document.documentElement.dir = L === 'he' ? 'rtl' : 'ltr';
    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.lang === L); });
    document.querySelectorAll('[data-t]').forEach(function (el) { var v = t[el.dataset.t]; if (typeof v === 'string') el.innerHTML = v; });
    $('note').placeholder = t.notePh; $('inc').setAttribute('aria-label', t.more); $('dec').setAttribute('aria-label', t.less);
    $('h-title').innerHTML = t.title;
    if (CFG) {
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(CFG.date || ''), d = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null;
      $('h-when').textContent = datesLine(CFG['Dates Line'], CFG.start, CFG.end) || (m ? m[3] + ' . ' + m[2] + ' . ' + m[1] : '');
      $('h-day').textContent = d ? t.weddingDay + ' · ' + d.toLocaleDateString(t.locale, { weekday: 'long', day: 'numeric', month: 'long' }) : '';
      $('h-where').textContent = CFG.place || '';
      $('h-script').textContent = txt('Script', t.script);
      // The card that slides out of the envelope carries the names and the dates (it was blank before).
      document.querySelector('.env-card').innerHTML = '<b>' + esc(txt('Names', CFG.couple)) + '</b><i dir="ltr">' + esc($('h-when').textContent) + '</i>';
      var mag = /^magazine$/i.test(CFG['Hero Layout'] || '');
      // Theme "Sage" (Shir & Ami's own design): ivory paper, mint envelope with a sage wax seal, olive branches and a watercolor landscape.
      var sage = /^sage$/i.test(CFG.Theme || '');
      document.body.classList.toggle('t-sage', sage);
      if (sage) {
        var en = CFG['Names EN'] || CFG.couple || '';
        $('env-top').textContent = en;
        $('env-seal').innerHTML = esc(en.split(/\s*&\s*|\s+and\s+/i).map(function (w) { return w.trim().charAt(0); }).filter(Boolean).join('&')) +
          '<svg viewBox="0 0 40 12" aria-hidden="true"><path d="M2 9C12 9 24 7 38 2" fill="none" stroke="currentColor" stroke-width="1"/><path d="M10 8.6c-1-2.4 1-4 3-4.4-.2 2.2-1.2 3.6-3 4.4zM18 7.6c-.6-2.6 1.4-3.8 3.4-4-.4 2.2-1.6 3.4-3.4 4zM26 5.6c-.2-2.4 1.8-3.4 3.6-3.4-.6 2-1.8 3-3.6 3.4zM14 9.2c2 1.6 4 1.2 5.2.2-2-1-3.6-1-5.2-.2zM22 8c2 1.4 3.8.8 5-.2-2-.8-3.4-.8-5 .2z" fill="currentColor"/></svg>';
        $('h-when').textContent = $('h-when').textContent.replace(/\s*([–.])\s*/g, '$1');
        var ci = document.querySelector('.env-card i'); if (ci) ci.textContent = $('h-when').textContent;
        // the couple's photo peeks out of the envelope under the date
        if (CFG['Hero Image']) document.querySelector('.env-card').insertAdjacentHTML('beforeend', '<img src="' + esc(CFG['Hero Image']) + '" alt="">');
      }
      $('hero').classList.toggle('mag', mag);
      if (mag) {
        $('h-kick').textContent = t.kicker; $('h-cue').textContent = sage && L === 'he' ? 'אישור הגעה' : t.cue;
        $('h-names').innerHTML = esc(txt('Names', CFG.couple)).replace(/ (&amp;|and|ו) /, ' <i>&amp;</i> ');
      }
      $('intro').innerHTML = lines(txt('Intro', t.intro));
      document.querySelector('.env-hello').textContent = txt('Invited', t.invited);
      $('ask').textContent = txt('Ask', t.ask);
      var hTitle = txt('Hosting Title'), hChips = txt('Hosting Chips'), hText = txt('Hosting Text'), hNote = txt('Hosting Note');
      $('hosting').hidden = !(hTitle || hChips || hText || hNote);
      $('ho-title').textContent = hTitle; $('ho-title').hidden = !hTitle;
      $('ho-chips').innerHTML = hChips.split(',').map(function (c) { return c.trim(); }).filter(Boolean).map(function (c) { return '<span>' + esc(c) + '</span>'; }).join('');
      $('ho-chips').hidden = !hChips;
      $('ho-text').innerHTML = lines(hText); $('ho-text').hidden = !hText;
      $('ho-note').innerHTML = lines(hNote); $('ho-note').hidden = !hNote;
      $('thanks-text').innerHTML = lines(txt('Thanks', t.thanks));
      document.title = (CFG.couple ? CFG.couple + ' – ' : '') + T.en.invited;
    }
    renderComp();
  }

  function saveComp() {
    document.querySelectorAll('.comp').forEach(function (el) {
      var n = el.dataset.n, d = compData[n] || {};
      d.first = el.querySelector('.cf').value; d.last = el.querySelector('.cl').value;
      compData[n] = d;
    });
  }
  // Events with their own Age Groups (Settings › Age Groups, e.g. the hotel's "Baby 0-4, Child 5-12, Teen 13-17"): one button per group, with its ages.
  function kidMode() { return groupRanges().length > 0; }
  function groupRanges() {
    return String((CFG && CFG['Age Groups']) || '').split(',').map(function (part) { var m = /^\s*([A-Za-z]+)\s+(\d+)\s*[-–]\s*(\d+)\s*$/.exec(part); return m && { name: m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase(), lo: +m[2], hi: +m[3] }; }).filter(Boolean)
      .sort(function (a, b) { return b.lo - a.lo; });
  }
  function groupTypes(t) {
    var r = groupRanges(), top = r.length ? r[0].hi + 1 : 18;
    return [['Adult', t.groupNames.Adult, top + '+']].concat(r.map(function (g) { return [g.name, t.groupNames[g.name] || g.name, g.lo + '–' + g.hi]; }));
  }
  function renderComp() {
    saveComp();
    var t = T[L], list = $('comp-list'); list.innerHTML = '';
    for (var n = 2; n <= guests; n++) {
      var d = compData[n] || (compData[n] = { type: kidMode() ? 'Adult' : 'adult', first: '', last: '' });
      if (kidMode() && /^[a-z]/.test(d.type)) d.type = 'Adult';
      var card = document.createElement('div'); card.className = 'comp'; card.dataset.n = n;
      card.innerHTML =
        '<div class="comp-title">' + t.guest + ' ' + n + '</div>' +
        '<div class="two">' +
          '<div class="field"><label class="lbl" for="cf' + n + '">' + t.first + '</label><input class="cf" id="cf' + n + '" type="text" placeholder="First name"></div>' +
          '<div class="field"><label class="lbl" for="cl' + n + '">' + t.last + '</label><input class="cl" id="cl' + n + '" type="text" placeholder="Last name"></div>' +
        '</div>' +
        '<div class="seg" role="group" aria-label="' + t.ageOf + ' ' + n + '">' +
          (kidMode() ? groupTypes(t) : t.types).map(function (x) {
            return '<button type="button" class="opt" data-t2="' + x[0] + '" aria-pressed="' + (d.type === x[0]) + '">' + x[1] + (x[2] ? '<small' + (/^\d/.test(x[2]) ? ' dir="ltr"' : '') + '>' + x[2] + '</small>' : '') + '</button>';
          }).join('') +
        '</div>';
      card.querySelector('.cf').value = d.first; card.querySelector('.cl').value = d.last;
      list.appendChild(card);
    }
    $('comp-wrap').hidden = guests < 2;
    $('guests').textContent = guests;
  }

  document.querySelector('.lang').addEventListener('click', function (e) {
    var b = e.target.closest('[data-lang]'); if (!b || b.dataset.lang === L) return;
    L = b.dataset.lang; try { localStorage.setItem('kai-rsvp-lang', L); } catch (x) {}
    apply();
  });
  $('comp-list').addEventListener('click', function (e) {
    var b = e.target.closest('.opt'); if (!b) return;
    var card = b.closest('.comp');
    compData[card.dataset.n].type = b.dataset.t2;
    card.querySelectorAll('.opt').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
  });
  $('attend').addEventListener('click', function (e) {
    var b = e.target.closest('.opt'); if (!b) return;
    attend = b.dataset.v;
    this.querySelectorAll('.opt').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
    $('coming').hidden = attend === 'no';
  });
  $('inc').addEventListener('click', function () { if (guests < 10) { guests++; renderComp(); } });
  $('dec').addEventListener('click', function () { if (guests > 1) { guests--; renderComp(); } });
  $('rsvp').addEventListener('submit', function (e) {
    e.preventDefault();
    var t = T[L];
    if (!$('first').value.trim() || !$('last').value.trim()) { $('err').textContent = t.errName; $('err').hidden = false; $('first').focus(); return; }
    var heb = [].slice.call(document.querySelectorAll(attend === 'no' ? '#first, #last' : '#first, #last, #comp-list .cf, #comp-list .cl')).filter(function (el) { return /[֐-׿]/.test(el.value); });
    if (heb.length) { $('err').textContent = t.errHeb; $('err').hidden = false; heb[0].focus(); return; }
    $('err').hidden = true;
    saveComp();
    var companions = [];
    if (attend !== 'no') for (var n = 2; n <= guests; n++) {
      var c = compData[n] || {};
      companions.push(kidMode() ? { first: c.first || '', last: c.last || '', type: c.type === 'Adult' ? 'adult' : 'child', group: c.type || 'Adult' } : { first: c.first || '', last: c.last || '', type: c.type || 'adult' });
    }
    var payload = { e: EVENT, first: $('first').value, last: $('last').value, phone: $('phone').value, attend: attend, note: $('note').value, companions: companions };
    var btn = this.querySelector('.send');
    btn.disabled = true; btn.textContent = t.sending;
    KAI_PUB(payload)
      .then(function (res) {
        if (!res.ok) throw new Error(res.error);
        // Next step: the guest area (only if it has more than the RSVP), already signed in with this phone.
        var more = CFG && ['Portal Flights', 'Portal Stay', 'Portal Info'].some(function (k) { return CFG[k] === 'on'; });
        $('to-portal').hidden = !more || attend === 'no';
        if (more) {
          $('portal-go').href = BASE + EVENT + '/guests' + (L === 'en' ? '?lang=en' : '');
          if (payload.phone) try { localStorage.setItem('kai-portal-' + EVENT, payload.phone); } catch (x) {}
        }
        // What they answered, and a copy they can send to themselves (with the link to change it).
        var who = [payload.first + ' ' + payload.last].concat(companions.map(function (c) { return (c.first + ' ' + c.last).trim(); }).filter(Boolean));
        var st = attend === 'yes' ? t.coming : attend === 'no' ? t.notComing : t.notSure;
        var head = (CFG && CFG.couple ? CFG.couple + ' · ' : '') + st + (attend === 'no' ? '' : ' · ' + t.people(1 + companions.length));
        $('recap').innerHTML = '<b>' + esc(t.youSaid) + '</b><span>' + esc(head) + '</span>' + (attend === 'no' ? '' : '<span>' + esc(who.join(', ')) + '</span>');
        var link = location.origin + location.pathname + (L === 'en' ? '?lang=en' : '');
        $('self-wa').href = 'https://wa.me/?text=' + encodeURIComponent(t.youSaid + '\n' + head + (attend === 'no' ? '' : '\n' + who.join(', ')) + '\n\n' + t.change + '\n' + link);
        try { localStorage.setItem('kai-rsvp-done-' + EVENT, '1'); } catch (x) {}
        $('rsvp').hidden = true; $('thanks').hidden = false;
        $('thanks').scrollIntoView({ behavior: 'smooth', block: 'center' });
      })
      .catch(function () { $('err').textContent = T[L].errSend; $('err').hidden = false; })
      .then(function () { btn.disabled = false; btn.textContent = T[L].send; });
  });
  $('edit').addEventListener('click', function () { $('thanks').hidden = true; $('rsvp').hidden = false; });

  // Grand design: swap this page for /app/grand with the event's own texts (Settings → Grand Config).
  function loadGrand(cfg) {
    var gc = null; try { gc = cfg['Grand Config'] ? JSON.parse(cfg['Grand Config']) : null; } catch (x) {}
    return fetch('/v2/grand.html').then(function (r) { if (!r.ok) throw new Error('grand'); return r.text(); }).then(function (html) {
      var inj = '<script>window.KAI_EVENT=' + JSON.stringify(EVENT) + ';window.KAI_GRAND=' + JSON.stringify(gc).replace(/</g, '\\u003c') + ';<\/script>';
      html = html.replace('<head>', '<head>' + inj);
      document.open(); document.write(html); document.close();
    });
  }

  // A guest who already answered (and comes back to change it) skips the envelope.
  try { if (localStorage.getItem('kai-rsvp-done-' + EVENT)) { document.body.classList.add('no-env'); $('open-env').checked = true; } } catch (x) {}
  try { history.scrollRestoration = 'manual'; } catch (x) {}
  window.scrollTo(0, 0);
  $('open-env').addEventListener('change', function () { window.scrollTo(0, 0); });
  apply();
  setTimeout(function () { document.body.classList.add('ready'); }, 2500);
  KAI_PUB({ action: 'rsvpInfo', e: EVENT })
    .then(function (res) {
      if (!res.ok) throw new Error(res.error);
      CFG = res.event;
      if (CFG['RSVP Form'] === 'off') { if (CFG['Default Language'] === 'en' || CFG['Default Language'] === 'he') L = chosen ? L : CFG['Default Language']; document.querySelector('.page').innerHTML = '<div class="missing">' + T[L].closed + '</div>'; return; }
      if (CFG.Template === 'Grand') return loadGrand(CFG);   // this event uses the Grand design
      if (!chosen && (CFG['Default Language'] === 'en' || CFG['Default Language'] === 'he')) L = CFG['Default Language'];
      if (CFG['Hero Image']) { $('h-img').src = CFG['Hero Image']; $('h-img').alt = CFG.couple; $('h-sea').hidden = false; $('hero').classList.remove('no-photo'); }
      else $('hero').classList.add('no-photo');
      apply();
      document.body.classList.add('ready');
    })
    .catch(function () {
      document.body.classList.add('ready');
      document.querySelector('.page').innerHTML = '<div class="missing">' + T[L].missing + '</div>';
    });
})();
</script>
