<head>

<title>Guest Portal</title>
<link rel="apple-touch-icon" id="touchicon" href="/app/icons/kai-180.png">

<style>

/* Guest portal: log in with a phone number, see and update the family on that number. Same look as the RSVP form. */
:root {
  --linen: #E9E3D8; --card: #FCFBF8; --field: #FFFFFF;
  --ink: #2E3A9E; --text: #1F1F21; --muted: #4A4A50; --soft: #77777E;
  --line: #D6D4CE; --hair: #E4E1DA; --ok: #2F6B2F; --ok-bg: #E3EEDF; --bad: #9B2C2C;
  --display: 'Ephesis', 'Gveret Levin', cursive;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Assistant', system-ui, -apple-system, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--linen); font-family: var(--sans); color: var(--text); }
.bar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: center; padding: 10px 0 6px; background: linear-gradient(var(--linen) 70%, transparent); }
.lang { display: flex; padding: 3px; gap: 2px; border-radius: 999px; background: rgba(252,251,248,.95); box-shadow: 0 0 0 1px rgba(60,48,30,.08); direction: ltr; }
.lang span { min-width: 58px; padding: 5px 10px; text-align: center; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); }
.lang span.on { background: var(--text); color: #FFF; }
.wrap { max-width: 480px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top, 0px)) 14px 32px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--card); border-radius: 4px; box-shadow: 0 1px 2px rgba(60,48,30,.10), 0 18px 28px -22px rgba(60,48,30,.45); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.head { text-align: center; padding: 22px 16px 18px; gap: 6px; }
.couple { font: 400 40px/1 var(--display); color: var(--ink); }
.when { font: 500 13px var(--sans); font-variant-numeric: lining-nums tabular-nums; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); direction: ltr; }
h2 { margin: 0; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
h2 .ic { width: 28px; height: 28px; border-radius: 999px; background: #F1EFEA; display: grid; place-items: center; font-size: 15px; }
.sub { margin: -6px 0 0; font-size: 13.5px; color: var(--soft); line-height: 1.45; }
.hello { font-size: 20px; font-weight: 700; text-align: center; }
.lbl { font-size: 13.5px; font-weight: 600; color: var(--muted); }
.input { height: 50px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); display: flex; align-items: center; padding: 0 14px; font-size: 18px; direction: ltr; justify-content: flex-end; color: var(--text); }
.input.ph { color: #A5A5AB; }
.btn { height: 52px; border: none; border-radius: 4px; background: var(--text); color: #FFF; font: 600 17px var(--sans); display: grid; place-items: center; }
.btn.light { background: transparent; color: var(--ink); border: 1px dashed var(--line); height: 44px; font-size: 15px; font-weight: 600; }
.note { font-size: 13.5px; color: var(--soft); text-align: center; line-height: 1.5; }
.member { border: 1px solid var(--hair); border-radius: 4px; background: var(--field); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.mtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mname { font-size: 16px; font-weight: 700; direction: ltr; }
.age { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #F1EFEA; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg span { min-height: 40px; border: 1px solid var(--line); border-radius: 4px; display: grid; place-items: center; font-size: 14px; text-align: center; padding: 2px; }
.seg span.on { background: var(--ink); border-color: var(--ink); color: #FFF; font-weight: 600; }
.seg span.no.on { background: var(--bad); border-color: var(--bad); }
.edit { font-size: 13px; color: var(--ink); text-decoration: underline; }
.saved { font-size: 13px; color: var(--ok); font-weight: 600; text-align: center; }
.flight { display: grid; grid-template-columns: 1.1fr .8fr 1fr; gap: 6px; }
.f { display: flex; flex-direction: column; gap: 4px; }
.f .lbl { font-size: 12px; }
.f .v { height: 42px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); display: flex; align-items: center; justify-content: center; font-size: 14.5px; direction: ltr; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.chk i { width: 20px; height: 20px; border-radius: 4px; background: var(--ink); color: #FFF; display: grid; place-items: center; font-style: normal; font-size: 13px; }
.dir { font-size: 13px; font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: .04em; }
.stay { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: #F6F4EF; border-radius: 4px; padding: 10px; text-align: center; }
.tile .k { font-size: 13.5px; color: var(--soft); }
.tile .v { font-size: 20px; font-weight: 700; direction: ltr; }
.who { font-size: 13px; color: var(--muted); text-align: center; }
.sched { display: flex; flex-direction: column; gap: 10px; }
.item { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: start; }
.item .t { font-weight: 700; font-size: 14px; direction: ltr; text-align: start; color: var(--ink); }
.item b { display: block; font-size: 15px; }
.item span { font-size: 13.5px; color: var(--muted); }
.wa { display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border: 1px solid var(--text); border-radius: 4px; font-size: 14.5px; font-weight: 600; }
.head { position: relative; }
.langsw { position: absolute; top: 8px; inset-inline-end: 8px; padding: 0; background: none; box-shadow: none; }
.langsw button { min-width: 0 !important; min-height: 28px !important; padding: 2px 8px !important; font-size: 12.5px !important; color: var(--soft) !important; background: none !important; text-decoration: underline; text-underline-offset: 3px; }
.langsw button[aria-pressed=true] { display: none; }
.ig { display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; color: var(--muted); font-size: 14px; text-decoration: none; }
.member .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.member .two input { height: 42px; border: 1px solid var(--line); border-radius: 4px; padding: 0 10px; font-size: 16px; direction: ltr; width: 100%; min-width: 0; }
.fixname { border: none; background: none; padding: 0; display: inline-flex; align-items: center; gap: 6px; text-align: start; }
.fixname .pen { font-size: 13px; font-weight: 400; color: var(--soft); }
.mtop .two { flex: 1 1 auto; min-width: 0; }
.kai { text-align: center; font: 500 11px var(--serif); letter-spacing: .3em; color: var(--muted); padding-top: 4px; direction: ltr; }

[hidden] { display: none !important; }
/* theme "Sage" (Settings › Theme = Sage, Shir & Ami): the same ivory, green and mint as their invitation */
body.t-sage { --linen: #F4EFE8; --card: #FAF7F2; --ink: #3F5D49; --text: #2C3B31; --muted: #5E6B60; --soft: #8C958C; --line: #D9DDD3; --hair: #E6E3DA; }
.t-sage .card { border-radius: 14px; box-shadow: 0 0 0 1px rgba(201,185,155,.55), 0 18px 28px -24px rgba(60,70,50,.45); }
.t-sage .couple { font: 400 36px/1.1 'Cormorant Garamond', 'Frank Ruhl Libre', serif; color: #24402F; }
.t-sage .hello, .t-sage h2 { font-family: 'Frank Ruhl Libre', var(--serif); font-weight: 500; color: #24402F; }
.t-sage .btn, .t-sage .hc-btn, .t-sage .seg button[aria-pressed=true], .t-sage .seg span.on { background: #C8D5C7; border: 1px solid rgba(110,130,110,.22); color: #2C3B31; }
.t-sage .btn, .t-sage .hc-btn { border-radius: 7px; font-family: 'Frank Ruhl Libre', var(--serif); font-weight: 400; }
.t-sage .btn.light { background: transparent; border: 1px dashed #C9BFA5; color: #3F5D49; }
.t-sage .seg button, .t-sage .seg span, .t-sage .member, .t-sage .input, .t-sage .f .v, .t-sage .member .two input { border-radius: 7px; }
.t-sage .seg span.no.on { background: #E9D9D5; border-color: #D9C2BC; color: #7A2E25; }
.t-sage .wa { border-radius: 7px; border-color: rgba(110,130,110,.35); background: #C8D5C7; color: #2C3B31; }
.t-sage .chk i { background: #3F5D49; }
.t-sage .age, .t-sage h2 .ic, .t-sage .tile { background: #EEF2EC; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.lang button { min-width: 58px; padding: 5px 10px; border: none; border-radius: 999px; background: transparent; font-size: 13px; font-weight: 500; color: var(--muted); min-height: 30px; }
.lang button[aria-pressed=true] { background: var(--text); color: #FFF; }
input.input { width: 100%; outline-offset: 2px; }
input.input::placeholder { color: #A5A5AB; }
html[dir=ltr] input.input { justify-content: flex-start; text-align: left; }
html[dir=rtl] input.input { text-align: right; }
button.btn { width: 100%; }
button.btn:disabled { opacity: .6; }
.seg button { min-height: 44px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); font-size: 15px; padding: 2px; }
.seg button[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #FFF; font-weight: 600; }
.seg button.no[aria-pressed=true] { background: var(--bad); border-color: var(--bad); }
.err { margin: 0; color: var(--bad); font-size: 14px; text-align: center; }
.linkbtn { background: none; border: none; padding: 0; color: var(--ink); text-decoration: underline; font-size: 13px; }
.f input { height: 44px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); text-align: center; font-size: 15px; direction: ltr; width: 100%; min-width: 0; padding: 0 4px; }
.chk input { width: 20px; height: 20px; accent-color: var(--ink); margin: 0; }
.chk { min-height: 44px; cursor: pointer; }
.addform { border: 1px dashed var(--line); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.addform .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.addform input { height: 44px; border: 1px solid var(--line); border-radius: 4px; padding: 0 10px; font-size: 15px; width: 100%; min-width: 0; direction: ltr; }
.member .who2 { font-size: 13px; font-weight: 700; color: var(--muted); }
.info-p { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--muted); }
.loading { text-align: center; color: var(--soft); padding: 40px 0; font-size: 15px; }
.homecard { flex-direction: row; align-items: center; gap: 12px; }
.homecard img { flex: none; width: 56px; height: 56px; border-radius: 13px; object-fit: cover; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.hc-txt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; color: var(--muted); line-height: 1.35; }
.hc-txt b { font-size: 15px; color: var(--text); }
.hc-btn { flex: none; height: 38px; padding: 0 16px; border: none; border-radius: 4px; background: var(--text); color: #FFF; font: 600 15px var(--sans); }
.hc-x { flex: none; width: 28px; height: 28px; border: none; background: none; color: var(--soft); font-size: 14px; padding: 0; }
.ios-help ol { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.5; }
.ios-help .hc-btn { align-self: flex-start; }
.venue { align-self: center; display: inline-flex; align-items: center; gap: 5px; justify-content: center; margin-top: 4px; color: inherit; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.venue[hidden], .countdown[hidden] { display: none; }
.countdown { margin-top: 10px; align-self: center; display: inline-block; padding: 4px 14px; border-radius: 999px; background: #F1EFEA; font-size: 14px; font-weight: 600; }
/* travel: shuttles, recommended flights, flights form, taxi, stay extension (settings per event) */
.todo{display:flex;flex-direction:column;gap:6px}
.todo div{display:flex;align-items:flex-start;gap:8px;font-size:14.5px;line-height:1.4}
.todo i{font-style:normal;width:22px;height:22px;border-radius:999px;display:grid;place-items:center;font-size:12px;flex:none}
.todo .y i{background:var(--ok-bg);color:var(--ok)}.todo .n i{background:#F1EFEA;color:var(--soft)}
.todo small{display:block;font-size:12.5px;color:var(--soft)}
.allok{display:flex;align-items:center;justify-content:center;gap:8px;padding:4px;font-size:15px;font-weight:700;color:var(--ok)}
.allok i{font-style:normal;width:24px;height:24px;border-radius:999px;background:var(--ok-bg);display:grid;place-items:center;font-size:13px}
.v5{text-align:center;display:flex;flex-direction:column;gap:12px;padding:2px 0}
.v5 p{margin:0;font-size:13.5px;color:var(--soft);line-height:1.6}.v5 p.s{font-size:12.5px}
.v5g{display:grid;grid-template-columns:1fr 1px 1fr}.v5g>span{background:var(--hair)}
.v5g div{display:flex;flex-direction:column;gap:2px}
.v5g em{font-style:normal;font-size:13px;letter-spacing:.12em;color:var(--soft);margin-bottom:4px}
.v5g b{font-family:var(--sans);font-size:21px;font-weight:600;line-height:1.4;font-variant-numeric:tabular-nums;direction:ltr}
.rtog{min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:none;border-top:1px solid var(--hair);padding:12px 0 0;font-size:14.5px;font-weight:700;color:var(--ink);width:100%}
.rtog::after{content:"";width:7px;height:7px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-2px)}
.rtog.open::after{transform:rotate(-135deg) translateY(-2px)}
.rec{display:flex;flex-direction:column}
.rec-h{font-size:15px;font-weight:700;text-align:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rec-h small{font-weight:500;color:var(--soft);font-size:13px}
.rf{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--hair)}
.rf-a{display:flex;flex-direction:column;gap:2px;min-width:0}.rf-a b{font-size:14.5px;font-weight:600}.rf-a span{font-size:13px;color:var(--soft)}
.rf-t{font-size:16px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.rec-n{margin:0;font-size:13px;color:var(--soft);text-align:center}
.blk{border:1px solid var(--hair);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:12px;background:#FFFDF9}
.sec{font-size:13.5px;font-weight:700;color:var(--muted);margin-top:2px}
.hr{height:1px;background:var(--hair);margin:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:7px 13px;font-size:14px}
.leg{border-radius:8px;padding:0 12px 12px;display:flex;flex-direction:column;gap:12px;border:1px solid}
.leg.go{background:#F1F3FC;border-color:#D5DAF3}.leg.back{background:#FBF7EE;border-color:#EADFC6}
.lh{display:flex;align-items:center;gap:10px;margin:0 -12px;padding:10px 12px;border-radius:8px 8px 0 0;color:#fff}
.go .lh{background:#2E3A9E}.back .lh{background:#856425}
.lh b{display:block;font-size:17px}.lh small{font-size:13px;opacity:.95}
.li{width:30px;height:30px;border-radius:999px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:16px}
.go .li{transform:scaleX(-1) rotate(-30deg)}.back .li{transform:rotate(-30deg)}
html[dir=ltr] .go .li{transform:rotate(-30deg)}html[dir=ltr] .back .li{transform:scaleX(-1) rotate(-30deg)}
.ff3{display:grid;grid-template-columns:1fr 1.15fr .8fr;gap:6px}
.ff3 .f .lbl{font-size:12.5px}
input.num{height:46px;border:1px solid var(--line);border-radius:6px;text-align:center;font-size:16px;direction:ltr;width:100%;min-width:0;padding:0 2px;text-transform:uppercase;background:var(--field)}
input.num::placeholder{color:#9A9AA1;text-transform:none}
.tbtn{position:relative;height:46px;border:1px solid var(--line);border-radius:6px;background:var(--field);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;direction:ltr;font-variant-numeric:tabular-nums;padding:0 2px}
.tbtn .ph,.pv .ph{color:#5E5E66;font-weight:400}
.tbtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.pickrow{width:100%;height:50px;border:1px solid var(--line);border-radius:8px;background:var(--field);display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.go .pickrow{border-color:#B9C1EC}.back .pickrow{border-color:#DCCBA3}
.pv{font-size:16px;font-weight:700}
.chg{font-size:13.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.go .chg{color:#2E3A9E}.back .chg{color:#856425}
.hint{font-size:13px;color:var(--ok);font-weight:600;margin-top:-4px}
.warn{background:#FBF1DE;color:#7E5210;border-radius:6px;padding:9px 12px;font-size:13.5px;line-height:1.5}
.wa-g{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:6px;font-size:15px;font-weight:600;text-decoration:none;background:#25D366;color:#fff}
.row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--field);width:100%;text-align:start}
.row .nm{font-size:16px;font-weight:700;min-width:44px}
.row .st{flex:1;font-size:13px;color:var(--soft);line-height:1.5}.row .st.ok{color:var(--ok)}
.row .pl{width:28px;height:28px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;color:var(--ink);flex:none}
.row.done .pl{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok);font-size:14px}
.acc{border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.acc .row{border:none;border-radius:0;background:#F3F4FB}.acc .blk{border:none;border-radius:0}
.btn2{height:46px;border:1px solid var(--line);border-radius:6px;background:var(--field);font-size:15px;font-weight:600}
.sumc{border:1px solid #CFE0C9;background:#F5FAF3;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.sumc b{font-size:15px}
.sumc div{font-size:14px;color:var(--muted);display:flex;gap:8px;line-height:1.5}
.sumc div em{font-style:normal;font-weight:700;min-width:40px;color:var(--text)}
.sumc div small{display:block;font-size:14px;color:var(--ok);font-weight:600}
.missing{font-size:13.5px;color:#7E5210;background:#FBF1DE;border-radius:6px;padding:9px 12px;line-height:1.5}
.hrow{min-height:44px;margin:-6px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:none;padding:0;width:100%;text-align:start}
.hrow h2{flex:1}
.hrow .chev{width:8px;height:8px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin-inline-end:6px}
.hrow.open .chev{transform:rotate(-135deg) translate(-3px,-3px)}
.cost{display:flex;gap:8px;align-items:flex-start;background:#FBF1DE;color:#7E5210;border-radius:6px;padding:10px 12px;font-size:13.5px;line-height:1.5;font-weight:600}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mailbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border:1px solid var(--text);border-radius:6px;font-size:15px;font-weight:600;color:var(--text);text-decoration:none;background:var(--field)}
.mailbtn.off{opacity:.4}
#sheet-wrap{position:fixed;inset:0;z-index:50}
#sheet-bg{position:absolute;inset:0;background:rgba(20,20,30,.35);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border-radius:18px 18px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease-out}
#sheet-wrap.in #sheet-bg{opacity:1}#sheet-wrap.in .sheet{transform:none}
.grab{width:38px;height:4px;border-radius:9px;background:#D6D4CE;margin:0 auto 12px}
.sh-h{font-size:17px;font-weight:700;margin-bottom:10px}
#sh-list{display:flex;flex-direction:column;gap:8px}
.sh-o{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--field);text-align:start}
.sh-r{width:20px;height:20px;border-radius:999px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.sh-t{flex:1;display:flex;flex-direction:column;gap:2px}.sh-t b{font-size:16px}.sh-t small{font-size:12.5px;color:var(--soft)}
.sh-o em{font-style:normal;font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-bg);border-radius:999px;padding:3px 8px;white-space:nowrap}
.go .sh-o.on{border-color:#2E3A9E;box-shadow:0 0 0 1px #2E3A9E}.go .sh-o.on .sh-r{border-color:#2E3A9E}.go .sh-o.on .sh-r::after{content:"";width:10px;height:10px;border-radius:9px;background:#2E3A9E}
.back .sh-o.on{border-color:#856425;box-shadow:0 0 0 1px #856425}.back .sh-o.on .sh-r{border-color:#856425}.back .sh-o.on .sh-r::after{content:"";width:10px;height:10px;border-radius:9px;background:#856425}

/* collapsible cards: a header that closes the card, and a one-line summary row when it is closed */
.hd{display:flex;align-items:center;gap:8px;background:none;border:none;padding:0;width:100%;text-align:start;min-height:44px;margin:-6px 0}
.hd h2{flex:1}
.chev2{width:8px;height:8px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(-135deg);margin:4px 6px 0;flex:none}
.cbody{display:flex;flex-direction:column;gap:12px}
.crow{display:none;align-items:center;gap:10px;background:none;border:none;padding:0;width:100%;text-align:start;min-height:44px}
.card.closed>.hd,.card.closed>.cbody{display:none}
.card.closed>.crow{display:flex}
.crow .ci{width:28px;height:28px;border-radius:999px;background:#F1EFEA;display:grid;place-items:center;font-size:14px;flex:none}
.card.done .crow .ci{background:var(--ok-bg);color:var(--ok)}
.crow .t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.crow .t b{font-size:16px}
.crow .t>span{font-size:13.5px;color:var(--soft);line-height:1.5}
.card.done .crow .t>span{color:var(--ok)}
.crow .ed{font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;flex:none}
.crow .chev{width:8px;height:8px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin:0 6px 4px;flex:none}
.card.done .crow .chev,.card:not(.done) .crow .ed{display:none}
.card:not(.closed) .closed-only{display:none}
.step{font-size:13px;font-weight:700;color:var(--ink);background:#EEF0FB;border-radius:999px;padding:2px 9px;margin-inline-start:auto;white-space:nowrap}
.step:empty{display:none}
#recs:empty{display:none}
.msaved{font-size:13.5px;font-weight:600;color:var(--ok);white-space:nowrap;margin-inline-start:auto}
.hnote{font-size:13.5px;color:var(--soft);text-align:center;margin-top:4px;line-height:1.5}
.hnote.ok{color:var(--ok);font-weight:600}
/* flights: the save bar shows only when something changed, sticks to the bottom of the card, and sits on top of the phone keyboard */
.fsave{position:sticky;bottom:0;margin:0 -16px -18px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);border-radius:0 0 4px 4px;display:flex;align-items:center;gap:10px;box-shadow:0 -8px 14px -12px rgba(60,48,30,.35);z-index:3}
.fsave span{flex:1;font-size:13.5px;color:var(--muted)}
.fsave .btn{width:auto!important;padding:0 18px;height:44px;flex:none;font-size:16px}
.fsave.kb{position:fixed;left:0;right:0;margin:0;bottom:auto;border-radius:0;z-index:40;padding:8px 14px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ok);color:#fff;border-radius:999px;padding:10px 18px;font-size:15px;font-weight:600;z-index:60;white-space:nowrap;box-shadow:0 6px 18px -8px rgba(0,0,0,.4)}
.dlg-bg{position:fixed;inset:0;background:rgba(31,31,33,.45);z-index:55;display:grid;place-items:center;padding:16px}
.dlg{background:var(--card);border-radius:8px;padding:20px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center}
.dlg b{font-size:17px}

/* Phones: fields at 16px so the iPhone never zooms in (that left pages too wide). */
@media (max-width:900px),(pointer:coarse){input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}}
/* Phones: the page itself never scrolls sideways; wide tables keep their own scroll. */
@media (max-width:759px){html{overflow-x:hidden}}

    return 'mailto:' + C.hotel + '?subject=' + encodeURIComponent('Stay extension – ' + ((INFO && INFO.couple) || '') + ' wedding') + '&body=' + encodeURIComponent(body);

  function renderSummary() {

  $('blocks').addEventListener('click', function (e) {

  // "Done" on the phone keyboard closes it.
  $('blocks').addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.f) e.target.blur(); });
  // A computer: clicking a filled-in date or time selects it, so typing replaces it.
  document.addEventListener('focusin', function (e) {
    var el = e.target; if (!el || el.readOnly || (el.placeholder !== 'DD/MM/YYYY' && el.placeholder !== 'HH:MM')) return;

  $('blocks').addEventListener('focusout', function (e) {

  });
  $('tr-same').addEventListener('change', function () {

    // Splitting starts everyone from the family's flights, so only the one who flies differently needs changing.

    TR.open = -1; markDirty(); renderBlocks();
  });
  function openSheet(i, k) {
    var C = cfg(), x = TR.groups[i], s = sug(C, x, k);
    var opts = (k === 'g' ? C.goT : C.backT).map(function (v) { return [v, tt('shuttle') + ' ' + v, k === 'g' ? tt('fromAirport') : tt('fromHotel')]; });

  $('rtog').addEventListener('click', function () { TR.recOpen = !TR.recOpen; renderShuttles(cfg()); });

  });
  $('mail').addEventListener('click', function (e) {

  });
  function saveFl() {
    var list = [];
    TR.groups.forEach(function (x) {
      x.nos.forEach(function (no) {
        list.push({ no: no, arrFlight: x.gF, arrDate: dmy(x.gD), arrTime: x.gT, arrBus: x.gB || '', depFlight: x.bF, depDate: dmy(x.bD), depTime: x.bT, depBus: x.bB || '' });

  // ---------- cards: open / closed, summaries, the line under the greeting ----------
  var OPEN = null, SV = {}, flDirty = false, wasDone = false, celebrated = false;
  var CARD = { rsvp: 'c-rsvp', shut: 'c-shut', fl: 'c-flights', info: 'c-info' };
  function rsDone() { return !P.show.rsvp || P.family.every(function (g) { return g.status === 'Confirmed' || g.status === 'Declined'; }); }
  function flDone() {

    $('rsvp-sum').textContent = !rd ? tt('rsvpAsk') : (yes.length ? (yes.length === 1 ? tt('coming1') + ' · ' : yes.length + tt('coming') + ' · ') + yes.join(', ') + (no.length ? ' · ' + tt('notComingL') + no.join(', ') : '') : tt('noneComing'));
    // flights
    $('c-flights').classList.toggle('done', fd); $('fl-ci').textContent = fd ? '✓' : '✈';
    var each = coming().map(fromGuest), same = each.length && each.every(function (x) { return keyOf(x) === keyOf(each[0]); });
    $('fl-sum').innerHTML = !fd ? esc(tt('flAsk')) : same ? legLine(each[0], 'g') + '<br>' + legLine(each[0], 'b') : esc(tt('allFl').replace('{n}', each.length));
    $('self-wa2').hidden = !(TR && TR.saved && fd); if (!$('self-wa2').hidden) $('self-wa2').href = $('self-wa').href;
    $('fsave').hidden = !flDirty; if (flDirty) $('sum-wrap').hidden = true;
    // shuttles
    var C = cfg();
    $('shut-t2').textContent = $('shut-t').textContent;
    $('shut-sum').textContent = hasSh(C) ? [C.goT.length ? tt('go') + ' ' + C.goT.join(', ') : '', C.backT.length ? tt('back') + ' ' + C.backT.join(', ') : ''].filter(Boolean).join(' · ') : tt('recShow');
    // steps and the line under the greeting

    $('hnote').classList.toggle('ok', ad);

    place();

  // The guest just finished everything: close RSVP and flights to their summaries and say so.
  function checkDone() {

    window.scrollTo({ top: 0, behavior: 'smooth' }); toast(tt('doneToast')); return true;

  function toast(t) { var el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 2200); }
  function markDirty() { if (flDirty) return; flDirty = true; $('fsave').hidden = false; $('sum-wrap').hidden = true; place(); }
  // Opening or closing a card keeps its top edge where it was, so the page does not jump.
