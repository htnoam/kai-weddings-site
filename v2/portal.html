<style>

/* Guest portal: log in with a phone number, see and update the family on that number. Same look as the RSVP form. */
:root {
  --linen: #E9E3D8; --card: #FCFBF8; --field: #FFFFFF;
  --ink: #2E3A9E; --text: #1F1F21; --muted: #4A4A50; --soft: #77777E;
  --line: #D6D4CE; --hair: #E4E1DA; --ok: #2F6B2F; --ok-bg: #E3EEDF; --bad: #9B2C2C;
  --display: 'Ephesis', 'Gveret Levin', cursive;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Assistant', system-ui, -apple-system, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--linen); font-family: var(--sans); color: var(--text); }
.bar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: center; padding: 10px 0 6px; background: linear-gradient(var(--linen) 70%, transparent); }
.lang { display: flex; padding: 3px; gap: 2px; border-radius: 999px; background: rgba(252,251,248,.95); box-shadow: 0 0 0 1px rgba(60,48,30,.08); direction: ltr; }
.lang span { min-width: 58px; padding: 5px 10px; text-align: center; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); }
.lang span.on { background: var(--text); color: #FFF; }
.wrap { max-width: 480px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top, 0px)) 14px 32px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--card); border-radius: 4px; box-shadow: 0 1px 2px rgba(60,48,30,.10), 0 18px 28px -22px rgba(60,48,30,.45); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.head { text-align: center; padding: 22px 16px 18px; gap: 6px; }
.couple { font: 400 40px/1 var(--display); color: var(--ink); }
.when { font: 500 12.5px var(--sans); font-variant-numeric: lining-nums tabular-nums; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); direction: ltr; }
h2 { margin: 0; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
h2 .ic { width: 28px; height: 28px; border-radius: 999px; background: #F1EFEA; display: grid; place-items: center; font-size: 15px; }
.sub { margin: -6px 0 0; font-size: 13.5px; color: var(--soft); line-height: 1.45; }
.hello { font-size: 20px; font-weight: 700; text-align: center; }
.lbl { font-size: 13.5px; font-weight: 600; color: var(--muted); }
.input { height: 50px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); display: flex; align-items: center; padding: 0 14px; font-size: 18px; direction: ltr; justify-content: flex-end; color: var(--text); }
.input.ph { color: #A5A5AB; }
.btn { height: 52px; border: none; border-radius: 4px; background: var(--text); color: #FFF; font: 600 17px var(--sans); display: grid; place-items: center; }
.btn.light { background: transparent; color: var(--ink); border: 1px dashed var(--line); height: 44px; font-size: 15px; font-weight: 600; }
.note { font-size: 12.5px; color: var(--soft); text-align: center; line-height: 1.5; }
.member { border: 1px solid var(--hair); border-radius: 4px; background: var(--field); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.mtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mname { font-size: 16px; font-weight: 700; direction: ltr; }
.age { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #F1EFEA; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg span { min-height: 40px; border: 1px solid var(--line); border-radius: 4px; display: grid; place-items: center; font-size: 14px; text-align: center; padding: 2px; }
.seg span.on { background: var(--ink); border-color: var(--ink); color: #FFF; font-weight: 600; }
.seg span.no.on { background: var(--bad); border-color: var(--bad); }
.edit { font-size: 13px; color: var(--ink); text-decoration: underline; }
.saved { font-size: 13px; color: var(--ok); font-weight: 600; text-align: center; }
.flight { display: grid; grid-template-columns: 1.1fr .8fr 1fr; gap: 6px; }
.f { display: flex; flex-direction: column; gap: 4px; }
.f .lbl { font-size: 12px; }
.f .v { height: 42px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); display: flex; align-items: center; justify-content: center; font-size: 14.5px; direction: ltr; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.chk i { width: 20px; height: 20px; border-radius: 4px; background: var(--ink); color: #FFF; display: grid; place-items: center; font-style: normal; font-size: 13px; }
.dir { font-size: 13px; font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: .04em; }
.stay { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: #F6F4EF; border-radius: 4px; padding: 10px; text-align: center; }
.tile .k { font-size: 12px; color: var(--soft); }
.tile .v { font-size: 20px; font-weight: 700; direction: ltr; }
.who { font-size: 13px; color: var(--muted); text-align: center; }
.sched { display: flex; flex-direction: column; gap: 10px; }
.item { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: start; }
.item .t { font-weight: 700; font-size: 14px; direction: ltr; text-align: start; color: var(--ink); }
.item b { display: block; font-size: 15px; }
.item span { font-size: 13.5px; color: var(--muted); }
.wa { display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border: 1px solid var(--text); border-radius: 4px; font-size: 14.5px; font-weight: 600; }
.head { position: relative; }
.langsw { position: absolute; top: 8px; inset-inline-end: 8px; padding: 0; background: none; box-shadow: none; }
.langsw button { min-width: 0 !important; min-height: 28px !important; padding: 2px 8px !important; font-size: 12.5px !important; color: var(--soft) !important; background: none !important; text-decoration: underline; text-underline-offset: 3px; }
.langsw button[aria-pressed=true] { display: none; }
.ig { display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; color: var(--muted); font-size: 14px; text-decoration: none; }
.member .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.member .two input { height: 42px; border: 1px solid var(--line); border-radius: 4px; padding: 0 10px; font-size: 16px; direction: ltr; width: 100%; min-width: 0; }
.fixname { border: none; background: none; padding: 0; display: inline-flex; align-items: center; gap: 6px; text-align: start; }
.fixname .pen { font-size: 13px; font-weight: 400; color: var(--soft); }
.mtop .two { flex: 1 1 auto; min-width: 0; }
.kai { text-align: center; font: 500 11px var(--serif); letter-spacing: .3em; color: var(--muted); padding-top: 4px; direction: ltr; }

[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.lang button { min-width: 58px; padding: 5px 10px; border: none; border-radius: 999px; background: transparent; font-size: 13px; font-weight: 500; color: var(--muted); min-height: 30px; }
.lang button[aria-pressed=true] { background: var(--text); color: #FFF; }
input.input { width: 100%; outline-offset: 2px; }
input.input::placeholder { color: #A5A5AB; }
html[dir=ltr] input.input { justify-content: flex-start; text-align: left; }
html[dir=rtl] input.input { text-align: right; }
button.btn { width: 100%; }
button.btn:disabled { opacity: .6; }
.seg button { min-height: 44px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); font-size: 15px; padding: 2px; }
.seg button[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #FFF; font-weight: 600; }
.seg button.no[aria-pressed=true] { background: var(--bad); border-color: var(--bad); }
.err { margin: 0; color: var(--bad); font-size: 14px; text-align: center; }
.linkbtn { background: none; border: none; padding: 0; color: var(--ink); text-decoration: underline; font-size: 13px; }
.f input { height: 44px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); text-align: center; font-size: 15px; direction: ltr; width: 100%; min-width: 0; padding: 0 4px; }
.chk input { width: 20px; height: 20px; accent-color: var(--ink); margin: 0; }
.chk { min-height: 32px; }
.addform { border: 1px dashed var(--line); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.addform .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.addform input { height: 44px; border: 1px solid var(--line); border-radius: 4px; padding: 0 10px; font-size: 15px; width: 100%; min-width: 0; direction: ltr; }
.member .who2 { font-size: 13px; font-weight: 700; color: var(--muted); }
.info-p { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--muted); }
.loading { text-align: center; color: var(--soft); padding: 40px 0; font-size: 15px; }
.homecard { flex-direction: row; align-items: center; gap: 12px; }
.homecard img { flex: none; width: 56px; height: 56px; border-radius: 13px; object-fit: cover; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.hc-txt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; color: var(--muted); line-height: 1.35; }
.hc-txt b { font-size: 15px; color: var(--text); }
.hc-btn { flex: none; height: 38px; padding: 0 16px; border: none; border-radius: 4px; background: var(--text); color: #FFF; font: 600 15px var(--sans); }
.hc-x { flex: none; width: 28px; height: 28px; border: none; background: none; color: var(--soft); font-size: 14px; padding: 0; }
.ios-help ol { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.5; }
.ios-help .hc-btn { align-self: flex-start; }
.venue { align-self: center; display: inline-flex; align-items: center; gap: 5px; justify-content: center; margin-top: 4px; color: inherit; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.venue[hidden], .countdown[hidden] { display: none; }
.countdown { margin-top: 10px; align-self: center; display: inline-block; padding: 4px 14px; border-radius: 999px; background: #F1EFEA; font-size: 14px; font-weight: 600; }
</style>
</head>

<main class="wrap">
  <div class="card head">
    <div class="lang langsw" role="group" aria-label="Language"><button type="button" data-lang="he" aria-pressed="true">עברית</button><button type="button" data-lang="en" aria-pressed="false">English</button></div>
    <div class="couple" id="couple">&nbsp;</div>
    <div class="when" id="when"></div>
    <a class="venue" id="venue" hidden target="_blank" rel="noopener"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span id="venue-t"></span></a>
    <div class="countdown" id="countdown" hidden></div>
    <div id="hi-wrap" hidden>
      <div class="hello" style="margin-top:12px" id="hello"></div>
      <div class="who"><span id="who-phone" dir="ltr"></span> · <button type="button" class="linkbtn" id="logout" data-t="logout"></button></div>
    </div>
  </div>

  <!-- log in -->
  <form class="card" id="login" novalidate hidden>
    <div class="hello" data-t="area"></div>
    <p class="sub" style="text-align:center;margin:0" data-t="areaSub"></p>
    <label class="lbl" for="phone" data-t="phoneLbl"></label>
    <input class="input" id="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="050-0000000">
    <p class="err" id="login-err" hidden></p>
    <button type="submit" class="btn" id="login-btn" data-t="enter"></button>
    <div class="note" data-t="stuck"></div>
  </form>

  <div class="loading" id="loading" data-t="loading"></div>

  <!-- the family -->
  <div id="family" hidden style="display:flex;flex-direction:column;gap:14px">
    <section class="card" id="c-rsvp" hidden>
      <h2><span class="ic">✓</span><span data-t="rsvpT"></span></h2>
      <p class="sub" data-t="rsvpSub"></p>
      <div id="members" style="display:flex;flex-direction:column;gap:10px"></div>
      <div class="addform" id="addform" hidden>
        <div class="who2" data-t="newMember"></div>
        <div class="two"><input id="a-first" data-ph="first" autocomplete="off"><input id="a-last" data-ph="last" autocomplete="off"></div>
        <div class="seg" id="a-age"></div>
        <div class="note" style="text-align:start" data-t="namesHint"></div>
      </div>
      <button type="button" class="btn light" id="add" data-t="addMember"></button>
      <p class="err" id="rsvp-err" hidden></p>
      <button type="button" class="btn" id="save-rsvp" data-t="save"></button>
      <div class="saved" id="rsvp-ok" hidden></div>
    </section>

    <section class="card" id="c-flights" hidden>
      <h2><span class="ic">✈</span><span data-t="flightsT"></span></h2>
      <p class="sub" data-t="flightsSub"></p>
      <label class="chk" id="same-wrap"><input type="checkbox" id="same"><span data-t="same"></span></label>
      <div id="flights" style="display:flex;flex-direction:column;gap:12px"></div>
      <p class="err" id="fl-err" hidden></p>
      <button type="button" class="btn" id="save-fl" data-t="saveFl"></button>
      <div class="saved" id="fl-ok" hidden></div>
    </section>

    <section class="card" id="c-stay" hidden>
      <h2><span class="ic">🛏</span><span data-t="stayT"></span></h2>
      <div id="stay"></div>
    </section>

    <section class="card" id="c-info" hidden>
      <h2><span class="ic">ℹ</span><span data-t="infoT"></span></h2>
      <div class="sched" id="info"></div>
    </section>
    <!-- save to home screen: shown after logging in, until saved or dismissed -->
    <section class="card homecard" id="c-home" hidden>
      <img id="home-img" src="/app/icons/kai-180.png" alt="" width="56" height="56">
      <div class="hc-txt"><b data-t="homeT"></b><span data-t="homeSub"></span></div>
      <button type="button" class="hc-btn" id="home-go" data-t="homeBtn"></button>
      <button type="button" class="hc-x" id="home-x" aria-label="✕">✕</button>
    </section>
    <div class="ios-help card" id="home-help" hidden>
      <b data-t="homeT"></b>
      <ol><li><span data-t="homeStep1"></span> <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5v10h14V11h-1"/></svg></li><li data-t="homeStep2"></li><li data-t="homeStep3"></li></ol>
      <button type="button" class="hc-btn" id="home-help-x" data-t="homeOk"></button>
    </div>
  </div>

  <a class="wa" href="https://ig.me/m/kai_wedding_planners" target="_blank" rel="noopener" style="color:inherit;text-decoration:none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg> <span data-t="wa"></span></a>
  <div class="kai">PLANNED BY KAI EVENT PLANNERS</div>
</main>

  try { var q = new URLSearchParams(location.search).get('lang'); if (q === 'he' || q === 'en') { L = q; chosen = true; } else if (localStorage.getItem('kai-rsvp-lang')) { L = localStorage.getItem('kai-rsvp-lang'); chosen = true; } } catch (e) {}

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function api(body) {
    return KAI_PUB(Object.assign({ e: EVENT }, body));
  }
  function pretty(p) { var m = /^\+972(\d{2})(\d{3})(\d{4})$/.exec(p || ''); return m ? '+972 ' + m[1] + ' ' + m[2] + ' ' + m[3] : p; }
  // Quick typing: 1409 or 14/9 → 14/09/<year>, 140927 → 14/09/2027. Year: the wedding's if known, else the next time that day comes.
  function smartDate(v, year) {
    v = String(v || '').trim(); if (!v) return '';
    var d, mo, y, m = /^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2}|\d{4})?)?$/.exec(v);
    if (m) { d = m[1]; mo = m[2]; y = m[3]; }
    else if (/^(\d{3,4}|\d{6}|\d{8})$/.test(v)) {
      if (v.length === 3) { if (Number(v.slice(1)) <= 12) { d = v.slice(0, 1); mo = v.slice(1); } else { d = v.slice(0, 2); mo = v.slice(2); } }
      else { d = v.slice(0, 2); mo = v.slice(2, 4); y = v.slice(4); }
    } else return v;
    if (Number(d) < 1 || Number(d) > 31 || Number(mo) < 1 || Number(mo) > 12) return v;
    if (y) y = y.length === 2 ? '20' + y : y;
    else if (year) y = String(year);
    else { var now = new Date(); y = now.getFullYear(); if (new Date(y, mo - 1, d) < new Date(y, now.getMonth(), now.getDate())) y++; }
    return ('0' + d).slice(-2) + '/' + ('0' + mo).slice(-2) + '/' + y;
  }
  // 930 → 09:30, 2130 → 21:30, 21 → 21:00, 9.30 → 09:30
  function smartTime(v) {
    v = String(v || '').trim(); if (!v) return '';
    var h, mi, m = /^(\d{1,2})[:.](\d{2})$/.exec(v);
    if (m) { h = m[1]; mi = m[2]; }
    else if (/^\d{1,4}$/.test(v)) { if (v.length <= 2) { h = v; mi = '00'; } else { h = v.slice(0, -2); mi = v.slice(-2); } }

  // While typing a date the slashes come by themselves: 14 → 14/, 14/09 → 14/09/

  function normDate(v) { return smartDate(v); }

  // ---------- text ----------
  function apply() {

      $('venue').hidden = !INFO.place; $('venue').href = mp || '#'; $('venue-t').textContent = INFO.place || '';
      document.title = (INFO.couple ? INFO.couple + ' – ' : '') + (L === 'he' ? 'האזור האישי' : 'Guest area');

  }

  // ---------- family ----------
  function renderFamily() {
    var t = T[L], fam = P.family;
    var last = fam[0] ? fam[0].last : '', sameLast = fam.every(function (g) { return g.last.toLowerCase() === last.toLowerCase(); });

    // Stay and info appear once there's something in them (they can be turned on early).
    var hasStay = fam.some(function (g) { return g.room || g.table || g.checkIn || g.checkOut; });
    var hasInfo = !!(P.info && (P.info.he || P.info.en));
    $('c-rsvp').hidden = !P.show.rsvp; $('c-flights').hidden = !P.show.flights; $('c-stay').hidden = !P.show.stay || !hasStay; $('c-info').hidden = !P.show.info || !hasInfo;
    $('members').innerHTML = fam.map(function (g) {
      var st = state[g.no] || g.status;
      var b = function (v, label, cls) { return '<button type="button" class="' + (cls || '') + '" data-no="' + g.no + '" data-st="' + v + '" aria-pressed="' + (st === v) + '">' + esc(label) + '</button>'; };
      // The name itself (with a small pencil) opens the name for correction, in place.
      var nm = names[g.no];
      return '<div class="member"><div class="mtop">' +
        (nm ? '<div class="two"><input data-nf="' + g.no + '" value="' + esc(nm.first) + '" placeholder="' + esc(t.first) + '" autocomplete="off"><input data-nl="' + g.no + '" value="' + esc(nm.last) + '" placeholder="' + esc(t.last) + '" autocomplete="off"></div>'
          : '<button type="button" class="mname fixname" data-fix="' + g.no + '" aria-label="' + esc(t.editName) + ': ' + esc(g.first + ' ' + g.last) + '">' + esc(g.first + ' ' + g.last) + '<span class="pen" aria-hidden="true">✎</span></button>') +
        '<span class="age">' + esc(t.ages[g.age] || g.age) + '</span></div>' +

    if (P.show.stay) renderStay();
    if (P.show.info) renderInfo();
  }
  var FL = ['arrDate', 'arrTime', 'arrFlight', 'depDate', 'depTime', 'depFlight'];
  function flightBlock(prefix, g, title) {
    var t = T[L], v = function (k) { return esc(g ? g[k] : ''); };
    var row = function (dir) {
      var d = dir === 'arr' ? 'arr' : 'dep';
      return '<div class="dir">' + (dir === 'arr' ? t.there : t.back) + '</div><div class="flight">' +
        '<label class="f"><span class="lbl">' + t.date + '</span><input data-fl="' + prefix + '" data-k="' + d + 'Date" inputmode="numeric" placeholder="DD/MM/YYYY" value="' + v(d + 'Date') + '"></label>' +
        '<label class="f"><span class="lbl">' + t.time + '</span><input data-fl="' + prefix + '" data-k="' + d + 'Time" inputmode="numeric" placeholder="HH:MM" value="' + v(d + 'Time') + '"></label>' +
        '<label class="f"><span class="lbl">' + t.flight + '</span><input data-fl="' + prefix + '" data-k="' + d + 'Flight" placeholder="LY 501" value="' + v(d + 'Flight') + '" autocapitalize="characters"></label></div>';
    };
    return '<div class="member">' + (title ? '<div class="who2">' + esc(title) + '</div>' : '') + row('arr') + row('dep') + '</div>';
  }
  function renderFlights() {
    var fam = P.family.filter(function (g) { return g.status !== 'Declined'; });
    var key = function (g) { return FL.map(function (k) { return g[k]; }).join('|'); };
    if (renderFlights.same === undefined) renderFlights.same = fam.every(function (g) { return key(g) === key(fam[0]); });
    $('same').checked = renderFlights.same; $('same-wrap').hidden = fam.length < 2;
    $('flights').innerHTML = renderFlights.same || fam.length < 2

  }
  function renderStay() {
    var t = T[L], fam = P.family;
    var coming = fam.filter(function (g) { return g.status !== 'Declined'; });
    var key = function (g) { return [g.room, g.table, g.checkIn, g.checkOut].join('|'); };
    var tiles = function (g) {
      var tile = function (k, v) { return '<div class="tile"><div class="k">' + k + '</div><div class="v">' + esc(v ? v.replace(/\/\d{4}$/, '') : '—') + '</div></div>'; };
      return '<div class="stay">' + tile(t.room, g.room) + tile(t.table, g.table) + tile(t.cin, g.checkIn) + tile(t.cout, g.checkOut) + '</div>';
    };
    var declined = fam.filter(function (g) { return g.status === 'Declined'; }).map(function (g) { return g.first; });
    if (!coming.length) { $('stay').innerHTML = '<div class="who">' + esc(declined.join(', ')) + ' · ' + t.notComing + '</div>'; return; }
    if (coming.every(function (g) { return key(g) === key(coming[0]); })) {
      $('stay').innerHTML = tiles(coming[0]) + '<div class="who" style="margin-top:8px">' + esc(coming.map(function (g) { return g.first; }).join(', ')) + (declined.length ? ' · ' + esc(declined.join(', ')) + ' ' + t.notComing : '') + '</div>';
    } else {
      $('stay').innerHTML = coming.map(function (g) { return '<div class="who2" style="margin:8px 0 6px">' + esc(g.first + ' ' + g.last) + '</div>' + tiles(g); }).join('');
    }
  }
  // Event info: each line is a paragraph; a line written as "date | title | details" becomes a schedule row.
  function renderInfo() {
    var raw = (P.info && (P.info[L] || P.info[L === 'he' ? 'en' : 'he'])) || '';
    $('info').innerHTML = raw.split('\n').map(function (line) {
      line = line.trim(); if (!line) return '';
      if (line.indexOf('|') > -1) {
        var p = line.split('|').map(function (x) { return x.trim(); });
        return '<div class="item"><div class="t">' + esc(p[0]) + '</div><div><b>' + esc(p[1] || '') + '</b>' + (p[2] ? '<span>' + esc(p.slice(2).join(' · ')) + '</span>' : '') + '</div></div>';
      }
      return '<p class="info-p">' + esc(line) + '</p>';
    }).join('');
  }

  // ---------- save to home screen (icon = the couple's photo, cropped square; KAI logo if there's none) ----------
  var installEvt = null, IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function standalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function photo(size) {
    var u = INFO && (INFO['Share Image'] || INFO['Hero Image']) || '';
    if (!u) return location.origin + '/app/icons/kai-' + (size > 192 ? 512 : size > 180 ? 192 : 180) + '.png';
    return /googleusercontent\.com/.test(u) ? u.replace(/=[swh]\d.*$/, '') + '=s' + size + '-c' : u;
  }
  function setApp() {
    var name = INFO && INFO.couple || 'KAI';
    $('apptitle').setAttribute('content', name); $('touchicon').href = photo(180); $('home-img').src = photo(180);
    var m = { name: name, short_name: name, start_url: location.origin + BASE + EVENT + '/guests', scope: location.origin + '/', display: 'standalone',
      background_color: '#E9E3D8', theme_color: '#E9E3D8',
      icons: [{ src: photo(192), sizes: '192x192' }, { src: photo(512), sizes: '512x512' }] };
    var l = document.getElementById('manifest');
    if (!l) { l = document.createElement('link'); l.rel = 'manifest'; l.id = 'manifest'; document.head.appendChild(l); }
    l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(m));
  }
  function showHome() {
    var off = false; try { off = localStorage.getItem('kai-home-x-' + EVENT) === '1'; } catch (e) {}
    $('c-home').hidden = !P || off || standalone() || !(IS_IOS || installEvt);
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; showHome(); });
  window.addEventListener('appinstalled', function () { installEvt = null; $('c-home').hidden = true; });
  $('home-go').addEventListener('click', function () {
    if (installEvt) { installEvt.prompt(); installEvt.userChoice.then(function () { installEvt = null; showHome(); }); return; }
    $('home-help').hidden = false; $('home-help').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  $('home-help-x').addEventListener('click', function () { $('home-help').hidden = true; });
  $('home-x').addEventListener('click', function () { try { localStorage.setItem('kai-home-x-' + EVENT, '1'); } catch (e) {} $('c-home').hidden = true; $('home-help').hidden = true; });

  // ---------- flow ----------
  function showLogin(msg) {
    P = null; $('loading').hidden = true; $('family').hidden = true; $('hi-wrap').hidden = true; $('login').hidden = false;
    $('login-err').hidden = !msg; if (msg) $('login-err').textContent = msg;
  }
  function enter(phone, quiet) {
    $('loading').hidden = false; $('login').hidden = true;
    return api({ action: 'portalLogin', phone: phone }).then(function (res) {
      if (!res.ok) {
        try { localStorage.removeItem(STORE); } catch (e) {}
        showLogin(quiet ? '' : (res.error === 'bad' ? T[L].errBad : res.error === 'none' ? T[L].errNone : T[L].errNet)); return;
      }
      P = res; PHONE = (phone.replace(/[^\d+]/g, '').replace(/^00/, '+').replace(/^0/, '+972').replace(/^(5\d{8})$/, '+972$1'));
      if (PHONE.charAt(0) !== '+') PHONE = '+' + PHONE;
      try { localStorage.setItem(STORE, phone); } catch (e) {}
      state = {}; renderFlights.same = undefined;
      $('loading').hidden = true; $('family').hidden = false; $('hi-wrap').hidden = false;
      apply(); showHome();
    }).catch(function () { showLogin(T[L].errNet); });
  }
  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('phone').value.trim(); if (!v) { $('login-err').textContent = T[L].errBad; $('login-err').hidden = false; return; }
    $('login-btn').disabled = true; enter(v, false).then(function () { $('login-btn').disabled = false; });
  });
  $('logout').addEventListener('click', function () { try { localStorage.removeItem(STORE); } catch (e) {} $('phone').value = ''; showLogin(''); });
  document.querySelector('.lang').addEventListener('click', function (e) {
    var b = e.target.closest('[data-lang]'); if (!b || b.dataset.lang === L) return;
    L = b.dataset.lang; try { localStorage.setItem('kai-rsvp-lang', L); } catch (x) {} apply();
  });
  var names = {};   // names being corrected: { guestNo: { first, last } }
  $('members').addEventListener('input', function (e) {
    var el = e.target, no = el.dataset.nf || el.dataset.nl; if (!no || !names[no]) return;
    names[no][el.dataset.nf ? 'first' : 'last'] = el.value; $('rsvp-ok').hidden = true;
  });
  $('members').addEventListener('click', function (e) {
    var fx = e.target.closest('[data-fix]');
    if (fx) { var g = P.family.filter(function (x) { return x.no === Number(fx.dataset.fix); })[0]; names[g.no] = { first: g.first, last: g.last }; renderFamily(); var inp = document.querySelector('[data-nf="' + g.no + '"]'); if (inp) inp.focus(); return; }
    var b = e.target.closest('[data-st]'); if (!b) return;
    state[b.dataset.no] = b.dataset.st; $('rsvp-ok').hidden = true;
    b.parentNode.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
  });
  $('add').addEventListener('click', function () { $('addform').hidden = false; this.hidden = true; $('a-first').focus(); });
  $('a-age').addEventListener('click', function (e) { var b = e.target.closest('[data-age]'); if (!b) return; newAge = b.dataset.age; this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); });
  $('save-rsvp').addEventListener('click', function () {
    var t = T[L], add = [];
    if (!$('addform').hidden && ($('a-first').value.trim() || $('a-last').value.trim())) {
      var f = $('a-first').value.trim(), l = $('a-last').value.trim();
      if (!f || !l || /[֐-׿]/.test(f + l)) { $('rsvp-err').textContent = t.errNames; $('rsvp-err').hidden = false; return; }
      add.push({ first: f, last: l, age: newAge, status: 'Confirmed' });
    }
    var bad = Object.keys(names).some(function (no) { var n = names[no]; return !n.first.trim() || !n.last.trim() || /[֐-׿]/.test(n.first + n.last); });
    if (bad) { $('rsvp-err').textContent = t.errNames; $('rsvp-err').hidden = false; return; }
    var nos = Object.keys(state).concat(Object.keys(names).filter(function (no) { return !(no in state); }));
    var members = nos.map(function (no) {
      var m = { no: Number(no) }; if (state[no]) m.status = state[no];
      if (names[no]) { m.first = names[no].first.trim(); m.last = names[no].last.trim(); }

    });
    var btn = this; btn.disabled = true; $('rsvp-err').hidden = true;
    api({ action: 'portalRsvp', phone: PHONE, members: members, add: add }).then(function (res) {
      if (!res.ok) throw new Error(res.error);
      P = res; state = {}; names = {}; $('a-first').value = ''; $('a-last').value = ''; $('addform').hidden = true; $('add').hidden = false;
      renderFamily(); $('rsvp-ok').textContent = t.saved; $('rsvp-ok').hidden = false;
    }).catch(function (x) { $('rsvp-err').textContent = x.message === 'closed' ? t.errClosed : t.errNet; $('rsvp-err').hidden = false; })
      .then(function () { btn.disabled = false; });
  });
  $('same').addEventListener('change', function () {
    var cur = collectFlights(); renderFlights.same = this.checked; renderFlights();

  function collectFlights() {

      (by[p] = by[p] || {})[k] = v;
    });
    var fam = P.family.filter(function (g) { return g.status !== 'Declined'; });
    if (by.all) return fam.map(function (g) { return Object.assign({ no: g.no }, by.all); });
    return Object.keys(by).map(function (no) { return Object.assign({ no: Number(no) }, by[no]); });
  }
  $('save-fl').addEventListener('click', function () {
    var t = T[L], list = collectFlights();
    var bad = list.some(function (f) { return ['arrDate', 'depDate'].some(function (k) { return f[k] && !/^\d{2}\/\d{2}\/\d{4}$/.test(f[k]); }) || ['arrTime', 'depTime'].some(function (k) { return f[k] && !/^([01]\d|2[0-3]):[0-5]\d$/.test(f[k]); }); });
    if (bad) { $('fl-err').textContent = t.errDate; $('fl-err').hidden = false; return; }
    var btn = this; btn.disabled = true; $('fl-err').hidden = true;
    api({ action: 'portalFlights', phone: PHONE, flights: list }).then(function (res) {
      if (!res.ok) throw new Error(res.error);
      P = res; renderFamily(); $('fl-ok').textContent = t.saved; $('fl-ok').hidden = false;
    }).catch(function (x) { $('fl-err').textContent = x.message === 'closed' ? t.errClosed : x.message && x.message.indexOf('Write') === 0 ? t.errDate : t.errNet; $('fl-err').hidden = false; })
      .then(function () { btn.disabled = false; });
  });

  // ---------- start ----------
  apply();
  api({ action: 'rsvpInfo' }).then(function (res) {
    if (!res.ok) throw new Error('missing');
    INFO = res.event; setApp();
    if (!chosen && (INFO['Default Language'] === 'en' || INFO['Default Language'] === 'he')) L = INFO['Default Language'];
    apply();
    var saved = ''; try { saved = localStorage.getItem(STORE) || ''; } catch (e) {}
    if (saved) enter(saved, true); else showLogin('');
  }).catch(function () { $('loading').textContent = T[L].missing; });
})();
