name: Build KAI Leads
on:
  push:
    branches: [main]
    paths:
      - 'leads-src/app/**'
      - '.github/workflows/build-kai-leads.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kai-leads-build
  cancel-in-progress: false
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: leads-src/app/package-lock.json
      - name: Install and build
        working-directory: leads-src/app
        run: |
          npm ci
          npm run build:site
      - name: Publish built app
        run: |
          rm -rf leads
          cp -R leads-src/app/dist leads
          git add leads
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build KAI Leads from source [skip ci]"
            git push
          fi
