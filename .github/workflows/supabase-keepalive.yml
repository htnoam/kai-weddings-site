# Keeps the new system's database (Supabase, free plan) from being paused after a week without use.
# Runs every 2 days; one tiny read. Nothing is deployed.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 4 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST 'https://icqwbbmscoednenpielh.supabase.co/rest/v1/rpc/kai_alive' \
            -H 'apikey: ${{ env.ANON }}' -H 'Authorization: Bearer ${{ env.ANON }}' -H 'Content-Type: application/json' -d '{}'
        env:
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljcXdiYm1zY29lZG5lbnBpZWxoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMDY3MTMsImV4cCI6MjEwOTc4MjcxM30.ZWXEnYa61bZgiYXEHETDIULZ9hplkKLxpgu7eJgkEy8
